["인사말·여행 개요","<p>김성원선생님 내외분께 드립니다. 안녕하세요,</p><p>저희 필라하나관광을 통하여 「가우디의 도시에서 안달루시아의 낭만까지, 스페인·포르투갈 여행」에 함께해 주셔서 진심으로 감사드립니다.</p><p>이번 여행은 유럽 남서부의 매력을 대표하는 스페인과 포르투갈의 아름다운 풍경과 깊은 역사, 그리고 각 도시만의 독특한 분위기를 만나보는 특별한 여행입니다. 강렬한 햇살 아래 펼쳐지는 스페인의 화려한 건축과 예술, 오랜 역사 속에 다양한 문화가 어우러진 도시의 풍경, 그리고 여유롭고 따뜻한 정취가 느껴지는 포르투갈까지, 두 나라가 지닌 서로 다른 매력을 함께 경험하실 수 있습니다.</p><p>때로는 활기찬 거리에서 현지의 생생한 분위기를 느끼고, 때로는 오랜 세월을 간직한 골목과 아름다운 풍경을 바라보며 여유로운 시간을 보내시기 바랍니다.</p><p>여행을 떠나시기 전 본 안내문을 꼼꼼히 확인해 주시고, 일정과 준비사항을 미리 숙지해 주시기 바랍니다.</p><p>열정과 낭만이 가득한 스페인, 그리고 여유와 정취가 아름다운 포르투갈에서 오래도록 기억에 남을 특별한 추억을 만들어 가시길 바라며, 다시 한번 저희와 함께해 주심에 감사드립니다. 여행당일에 건강한 모습으로 뵙겠습니다.</p><p>필라 하나관광 담당 최용정 드림</p><p>여행 순서(지도): ①바르셀로나 ②몬세라트 ③마드리드 ④톨레도 ⑤코르도바 ⑥세비야 ⑦론다 ⑧그라나다 ⑨신트라 ⑩리스본</p><p>필라하나관광: 7827 Old York Road, Elkins Park PA 19027 · www.PhilaHana.com · 215-935-2500</p>"],
["공항셔틀 안내","<div class='sc'><table class='tbl'><tr><td>10/22(목)<br>필라 공항방면<br>(7827 Old York Rd, Elkins Park, PA 19027)</td><td><b>3:30pm 출발</b></td></tr><tr><td>10/31(토)<br>필라방면</td><td>5:00pm 도착예정</td></tr></table></div><ul><li>셔틀은 안내드린 시간에 어떠한 예외없이 정시 출발합니다.</li><li>혹시 셔틀을 안타시게 될경우 미리 저희 여행사로 연락 부탁드립니다.</li><li>당일 셔틀을 운행하며 수고하시는 분게 소정의 팁(편도 $5/인)을 주시면 감사하겠습니다.</li></ul>"],
["항공권 (American Airlines E-Ticket)","<ul><li>탑승자: Kim, Sung Won / Kim, Soon Ae</li><li>예약번호(Reservation No): QTMETJ (두 분 공통)</li><li>(여행하시는 분의 인적사항을 확인후, 여권과 대조하시고 오류가 있을시 즉시 알려주십시오)</li></ul><p><b>22 OCT 26 - THURSDAY</b><br>AMERICAN 742 ECONOMY / EQUIP-788<br>LV: PHILADELPHIA 725P · NONSTOP · MILES-3914 · CONFIRMED<br>AR: BARCELONA 905A · ELAPSED TIME-7:40 · ARVL DATE-23 OCT</p><p><b>31 OCT 26 - SATURDAY</b><br>AMERICAN 259 ECONOMY / EQUIP-789<br>LV: LISBON 1055A · NONSTOP · MILES-3450 · CONFIRMED<br>AR: PHILADELPHIA 250P · ELAPSED TIME-7:55</p>"],
["1) 날씨","<p>스페인/포르투칼은 지역에 따라 날씨 차이가 있으며, 일정 중 바르셀로나·마드리드·세비야·그라나다 등 여러 지역을 이동하게 되므로 일교차와 지역별 기온 차이에 대비하시는 것이 좋습니다. 현지날씨 예상기온을 안내드립니다. 출발전에 인터넷을 통하여 보다 정확한 날씨를 확인하여 주십시요.</p><div class='sc'><table class='tbl'><tr><td>바르셀로나</td><td>71° / 57°</td></tr><tr><td>마드리드</td><td>64° / 49°</td></tr><tr><td>톨레도</td><td>69° / 48°</td></tr><tr><td>코르도바</td><td>70° / 46°</td></tr><tr><td>그라나다</td><td>69° / 46°</td></tr><tr><td>세비야</td><td>74° / 54°</td></tr><tr><td>리스본</td><td>68° / 55°</td></tr></table></div>"],
["2) 여권","<p>다시한번 여권을 확인하시고 출발일로부터 <b>6개월이상 유효</b>한지 확인하십시오. 여권은 전일정 본인소지입니다.</p><p><b>미국 시민권자는 여권, 영주권자는 여권/영주권을 필히 가져오셔야 합니다.</b></p>"],
["3) 항공권·좌석·기내 반입·수하물","<p>이번여행은 전일정 전자티켓방식의 항공권입니다. 따라서 특별이 소지할것은 없습니다. 또한, 항공기 좌석배정은 그룹예약 규정상 항공사에 의해 지정되었습니다. 모든분의 preference 를 맞출수 없는점 양해부탁드리며 공항에서 재확인바랍니다.</p><p>기내에는 Carry-on 가방 1개(최대 22×35×56cm / 9×14×22인치)와 개인 소지품 1개를 무료로 반입할 수 있습니다. 기내 수하물에는 100ml를 초과하는 액체류, 뾰족한 물품 및 폭발성 물품은 반입할 수 없으며, 액체류는 투명한 지퍼백에 별도로 보관해 주시기 바랍니다.</p><p><b>위탁수하물은 1인당 1개까지 무료</b>입니다.</p>"],
["4) 짐꾸리기","<p>매일 다른 지역으로 이동하는 일정이므로 짐은 가능한 한 최소화하여 준비해 주시기 바랍니다. 낮에는 비교적 따뜻하고 햇볕이 강할 수 있지만, 아침저녁에는 기온이 내려가 쌀쌀하게 느껴질 수 있습니다. 가볍고 얇은 옷을 여러 겹 겹쳐 입을 수 있도록 준비하시고, 긴팔 셔츠, 얇은 니트 또는 가벼운 외투와 함께 일교차와 갑작스러운 날씨 변화에 대비할 수 있는 방수·바람막이 재킷을 준비해 주세요. 신발은 운동화나 하이킹화를 권장합니다.</p>"],
["5) 간단한 세면도구 준비","<p>호텔에 따라 준비해 두는 경우도 있지만 일반적으로 치약, 칫솔, 면도기 등은 구비되어 있지 않습니다. 개인적으로 준비해주시고 실내슬리퍼도 준비해주세요.</p>"],
["6) 상비약 준비","<p>평소에 복용하는 약은 그대로 준비하는 것이 좋습니다. 그 외에 다음과 같은 비상약을 준비하면 유용하게 사용할 수 있습니다.</p><p>예) 지사제, 소화제, 신경안정제, 진통제, 멀미약, 감기약, 피로회복제, 1회용 밴드 등</p>"],
["7) 전압·어댑터","<p>이번 방문지 전압은 <b>220 볼트</b>입니다. 전압기는 불필요합니다만 <b>어댑터는 최소 2개 이상</b> 준비하십시요. 여분의 어댑터가 없거나, 구입이 어려운 경우 저희 여행사에서 <b>$5/each</b> 구입하실수 있으니 미리 요청해 주십시요.</p>"],
["8) 환전·카드","<p>스페인은 <b>유로</b>를 사용합니다. 현지에서 사용할 비용은 여행중 음료수,기념품등외는 없습니다만 약간의 현금은 여행중 필요할수 있습니다. 통상 <b>$200/인</b> 정도의 환전을 추천드리며 환전액수중 약 <b>20 유로정도는 동전</b>으로 요청하십시요. 화장실/객실팁/ 커피/등 사용에 매우 용이합니다. 대부분의 호텔, 식당 및 관광지에서는 신용카드 사용이 가능합니다. 출국 전 카드사에 해외여행 및 해외 사용 예정 사실을 미리 알리고, 해외 결제가 가능하도록 설정을 확인해 주세요</p>"],
["9) 공동경비·개별 부담","<p><b>공동경비($200.00)</b>는 전문가이드/식당팁/버스기사의 팁으로 사용됩니다. 출발당일 현금으로 준비해주시기 바랍니다.</p><p>호텔객실팁(1 박 1 유로/인), 생수, 음료수, 유료화장실 비용등을 개별부담입니다.</p>"],
["10) 여행자보험","<p>여행 중 발생할 수 있는 예상치 못한 사고와 응급치료 등에 대비하여 여행자보험 가입을 권장합니다. 보험 미가입으로 발생하는 해외 의료비 등 개인적인 비용은 필라하나관광에서 보상해 드릴 수 없으므로, 현재 가입하신 건강보험의 해외 보장 여부도 미리 확인해 주세요. 추천 상품은 Travel Guard의 Pack-N-Go 플랜이며, 보험료는 연령에 따라 달라집니다. 출발 3일 전까지 가입 가능하며, 가입하신 분께는 출발 당일 보험증과 약관을 전달해 드립니다.</p>"],
["11) 개인수신기·건전지","<p>저희 필라하나관광은 관광의 재미를 한층 더 해드릴수 있도록 투어중 개인수신기를 사용합니다. <b>'AA' 사이즈 건전지를 한분당 2개씩</b> 준비해 주십시요. 수신기는 한대당 교체비용이 <b>$85불</b>이니 분실/파손되지 않도록 해주십시요.</p>"],
["웹사이트 예약·변경 규정","<ul><li>출발 14일 전(10/8) 이후로는 아무 변경을 하실 수가 없습니다.</li><li>부득이 취소 시 환불은 불가하며, 대처하실 분이 있으면 수수료 $350~$650를 내고 바꿀 수 있습니다. 항공사/랜드사의 유가인상이나 세금은 추가 부담입니다.</li><li>출발 60일 전까지 여행자보험비 및 잔여금 완불.</li><li>여행자보험 가입 시한은 종이 안내문(출발 3일 전까지)과 웹사이트(60일 전 완불)가 달라 보이니 여행사에 확인하세요.</li></ul>","web"]
