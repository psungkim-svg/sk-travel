<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>SK-여행 체크리스트 v1.3.0 — 붙여넣기용</title>
<style>
* { box-sizing: border-box; }
body {
margin: 0;
font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
background: #f5f7fb;
color: #111;
}
.wrap { max-width: 860px; margin: 0 auto; padding: 12px; }
h1 { font-size: 24px; margin: 4px 0 12px; font-weight: 800; }
.toolbar { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
button { min-height:44px; border: none; background: #1f6feb; color: white; padding: 10px 14px; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; }
button.secondary { background: #5c667a; }
button.danger { background: #d9534f; }
button.small { padding: 8px 12px; font-size: 14px; border-radius: 6px; }
button.small.danger { background: #d9534f; }
details { background: white; border-radius: 10px; margin-bottom: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); overflow: hidden; }
summary { list-style: none; cursor: pointer; padding: 14px 16px; font-weight: 800; font-size: 20px; position: relative; background: #fff; color: #0b1a3d; }
summary::-webkit-details-marker { display: none; }
summary::after { content: "▶"; position: absolute; right: 16px; top: 14px; color: #666; transition: transform .2s ease; }
details[open] summary::after { transform: rotate(90deg); }
.content { padding: 0 12px 14px; border-top: 1px solid #eee; }
.group { padding-top: 14px; margin-top: 12px; border-top: 2px dashed #f0f4f8; }
.group:first-child { border-top: none; margin-top: 0; padding-top: 8px; }
.group h3 { margin: 0 0 8px; font-size: 17px; color: #1f6feb; font-weight: 700; }
.check-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
.item {
display: flex; align-items: center; gap: 6px;
background: #f4f8ff; border: 1px solid #cce0ff; border-radius: 6px;
padding: 6px 6px; font-size: 17px; font-weight: 700;
line-height: 1.25; min-height: 44px; word-break: keep-all;
}
.item input[type="checkbox"] { margin-top: 1px; flex-shrink: 0; transform: scale(1.3); accent-color: #1f6feb; }
.span-1 { grid-column: span 1; }
.span-2 { grid-column: span 2; }
.span-3 { grid-column: span 3; }
.span-4 { grid-column: span 4; }
.note { background: #fffdf5; border: 1px solid #ffebb5; border-radius: 8px; padding: 10px; margin-top: 8px; font-size: 15px; font-weight: 600; line-height: 1.45; color: #332b00; }
.memo-list { margin: 6px 0 0 0; padding-left: 20px; }
.footer { height: 20px; }
.memo-input-area { margin-top: 12px; }
.memo-input-area textarea {
width: 100%; min-height: 60px; border: 1px solid #cce0ff;
border-radius: 8px; padding: 10px; font-size: 16px; font-weight: 600;
font-family: inherit; resize: vertical;
}
.memo-input-area .btn-row { display: flex; gap: 6px; margin-top: 6px; }
.saved-memos { margin-top: 10px; }
.saved-memo-item {
display: flex; justify-content: space-between; align-items: flex-start;
background: #eef6ff; border: 1px solid #cce0ff; border-radius: 8px;
padding: 10px; margin-bottom: 6px; font-size: 16px; font-weight: 600;
line-height: 1.4; word-break: break-all;
}
.saved-memo-item .del-btn {
background: #d9534f; color: white; border: none; border-radius: 6px;
padding: 4px 10px; font-size: 13px; font-weight: bold; cursor: pointer;
flex-shrink: 0; margin-left: 8px;
}
</style>
</head>
<body>
<div id="packingMount" role="status" style="padding:20px">준비물 자료를 불러오는 중입니다…</div>
<script>
(function(){
 const mount=document.getElementById('packingMount');
 Promise.resolve().then(()=>window.parent.__skPrivateAsset('packing-content.json')).then(text=>JSON.parse(text)).then(data=>{
  if(!data||data.format!=='sk-packing-content'||data.version!==1||typeof data.html!=='string')throw Error('자료 형식 오류');
  mount.innerHTML=data.html;
  if(typeof document.querySelectorAll==='function')document.querySelectorAll('a[href="index.html"]').forEach(a=>a.addEventListener('click',e=>{if(window.parent&&typeof window.parent.goTab==='function'){e.preventDefault();window.parent.goTab('home');}}));
  const script=document.createElement('script');script.src='packing-app.js';script.onload=()=>{try{const text=window.parent.__pendingPackingUpdate;if(typeof text==='string'&&text){const input=document.getElementById('packImportText'),button=document.getElementById('packCompare');if(input&&button){input.value=text;button.click();window.parent.__pendingPackingUpdate=null;input.scrollIntoView({block:'center'});}}}catch(_){}};script.onerror=()=>{mount.textContent='준비물 기능을 불러오지 못했습니다. 로컬 서버와 파일을 확인하세요.'};document.body.appendChild(script);
 }).catch(()=>{mount.textContent='준비물 자료가 없습니다. 업데이트에서 개인 여행 자료 파일을 선택해 주세요.'});
})();
</script>
</body>
</html>
