<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17644e"><link rel="manifest" href="manifest.json"><link rel="icon" href="icons/favicon-32.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><title>SK 여행 · 현장 가이드</title><style>
:root{--type-title:24px;--type-subtitle:21px;--type-body:18px;--type-spacing:0px;--type-line-height:1.2;--ink:#172c32;--green:#17644e;--muted:#5d7174;--line:#dce7e2}*{box-sizing:border-box}body{margin:0;background:#f3f7f5;color:var(--ink);font-family:system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;font-size:var(--type-body);letter-spacing:var(--type-spacing);font-weight:550;line-height:var(--type-line-height)}button,input,textarea,select{font:inherit}button{cursor:pointer}main{max-width:740px;margin:auto;padding:14px 15px 100px}.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 0 12px;white-space:nowrap}.top button{flex:0 0 auto;max-width:116px;overflow:hidden;text-overflow:ellipsis;font-size:calc(var(--type-body) - 2px);padding:7px 9px}.top b{font-size:var(--type-title);white-space:nowrap;flex:0 0 auto}.top button,.soft{background:#e1f0e8;color:#145941;border:1px solid #bcd8c9;border-radius:10px;padding:9px 11px;font-weight:750}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.tile{border-radius:15px;padding:12px 4px;min-height:85px;text-align:center;background:#e3eff5}.tile:nth-child(2){background:#dcefe4}.tile:nth-child(3){background:#edf1de}.tile small{display:block;color:#405b61;font-size:calc(var(--type-body) - 4px);line-height:1.3}.tile b{font-size:var(--type-body);display:block;margin:10px 0 0}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:17px;margin:11px 0;box-shadow:0 2px 9px #173e2c09}.row{display:flex;align-items:center;justify-content:space-between;gap:9px}.muted{color:var(--muted);font-size:calc(var(--type-body) - 2px);line-height:1.5}.eyebrow{color:var(--green);font-size:12px;font-weight:800}h1{font-size:var(--type-title);margin:7px 0}h2{font-size:var(--type-subtitle);margin:0 0 12px}h3{font-size:var(--type-subtitle);margin:9px 0}.nav{display:grid;grid-template-columns:1fr 1.1fr 1fr;gap:6px;margin:17px 0 12px}.nav button{border:1px solid #bad2c7;background:white;color:var(--green);border-radius:11px;padding:11px 2px;font-size:calc(var(--type-body) - 2px);font-weight:800}.nav button:nth-child(2),.primary{border:0;background:var(--green);color:white;border-radius:11px;padding:11px 13px;font-weight:800}.photo{width:100%;height:210px;object-fit:cover;border-radius:13px;background:#e9f0eb}.emptyPhoto{min-height:130px;background:#ecf3ef;border:1px dashed #9db6a8;border-radius:13px;display:grid;place-items:center;color:#526e62;text-align:center;padding:16px}.thumbs{display:flex;gap:6px;margin-top:7px;overflow:auto}.thumbs img{height:64px;width:80px;object-fit:cover;border-radius:7px;cursor:pointer}.fact{padding:10px 0;border-bottom:1px solid #e8efeb;line-height:1.5}.fact b{color:#195947}.next{background:#e7f3eb;border-radius:12px;padding:12px;line-height:1.5;margin-top:12px}details{margin:10px 0;border:1px solid var(--line);border-radius:13px;padding:13px;background:#fff}summary{font-weight:800;cursor:pointer}details details{background:#f7faf8}.trip{border:1px solid var(--line);border-radius:13px;padding:12px;margin:9px 0}.trip.active{border:2px solid var(--green);background:#f0f8f2}.actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.actions button{border:1px solid #bad2c7;border-radius:9px;background:#fff;color:#175c45;padding:8px;font-size:12px;font-weight:750}.actions button.active{background:var(--green);color:#fff}.danger{color:#aa3e2e!important}.warning{color:#ad3829;font-weight:750}.alert{background:#fff0e9;border-left:4px solid #d05a38;padding:10px;margin:10px 0;border-radius:6px}.banner{background:#fff0c9;color:#654500;padding:10px;border-radius:10px;margin-bottom:10px}.toolbar{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.toolbar button{border:1px solid #bdd4ca;border-radius:9px;background:white;padding:9px;color:var(--green);font-weight:700}.field{display:block;font-weight:750;font-size:calc(var(--type-body) - 2px);margin:12px 0}.field textarea[name=raw]{min-height:54vh;line-height:1.65}.field input,.field textarea,.field select{width:100%;border:1px solid #b8c9c0;border-radius:9px;padding:11px;margin-top:5px;background:white;color:var(--ink)}textarea{min-height:105px;resize:vertical}.small{font-size:calc(var(--type-body) - 3px);color:var(--muted)}.tabbar{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));width:100%;z-index:5;padding:8px 0 max(10px,env(safe-area-inset-bottom));z-index:4}.tabbar button{width:100%;min-width:0;overflow:hidden;text-overflow:clip;white-space:nowrap;border:0;background:white;color:#627971;font-size:clamp(11px,3vw,16px);padding:8px 0;font-weight:750}.tabbar button.on{color:var(--green);border-top:3px solid var(--green)}.modal{position:fixed;inset:0;background:#f4f8f6;z-index:10;overflow:auto}.modalBody{max-width:980px;margin:auto;padding:14px 12px 80px;min-height:100dvh}.modalHead{position:sticky;top:0;background:#f4f8f6;padding:10px 0;border-bottom:1px solid var(--line);z-index:1}.pill{background:#edf3ee;padding:4px 8px;border-radius:20px;font-size:12px}.iframe{width:100%;min-height:78vh;border:0;background:white;border-radius:12px}.hidden{display:none!important}

/* Original attached SK-여행 top three cards: unchanged font sizes, colors and geometry. */
.home-top-board{--ink:#172033;--dark:#0b5ed7}
.home-top-board{display:grid;grid-template-columns:.9fr 1fr 1.2fr;gap:8px;margin:0 -6px 10px}
.top-swap{transition:opacity .22s ease,transform .22s ease;will-change:opacity,transform}.home-top-board.is-switching .top-swap{opacity:.22;transform:translateY(3px)}@media (prefers-reduced-motion: reduce){.top-swap{transition:none}.home-top-board.is-switching .top-swap{opacity:1;transform:none}}
.top-cell{display:flex;flex-direction:column;justify-content:center;border:1px solid #dbe7f6;background:#fff;border-radius:14px;padding:0;min-width:0;height:57px;overflow:hidden;box-shadow:0 3px 10px rgba(22,34,66,.08);text-align:center;color:var(--ink);width:100%;transition:background-color .35s ease,color .35s ease,border-color .35s ease}
.top-cell.home{background:var(--dark);color:#fff;border-color:var(--dark)}
.top-cell.dest{background:#e9f6ff}
.top-cell.wx{background:#fff8d6;border-color:#ffe58a;cursor:pointer}
.top-cell.wx:active{transform:scale(.98)}
.top-cell.tone-morning{background:#dff3ff;border-color:#b9def8;color:#12325b}
.top-cell.tone-day{background:#0b5ed7;border-color:#084298;color:#fff}
.top-cell.tone-night{background:#000;border-color:#000;color:#fff}
.top-label{font-size:clamp(12px,3.35vw,14px);font-weight:750;line-height:1.2;opacity:.92;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.65px}
.top-value{font-size:clamp(14px,4vw,17px);font-weight:950;line-height:1.16;margin-top:0;letter-spacing:-.7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.top-cell .top-swap{width:100%}
.top-cell .top-label,.top-cell .top-value,.top-cell .top-sub{width:100%;text-align:center}
.top-cell.dest .top-label,.top-cell.wx .top-label{font-size:clamp(12px,3.35vw,14px);letter-spacing:-.75px}
.top-cell.wx .top-value{font-size:clamp(14px,4vw,17px);letter-spacing:-.75px}
.top-sub{font-size:12px;font-weight:800;line-height:1.2;margin-top:0;opacity:.84;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.6px}

.wx7{border:1px solid #dbeafe;border-radius:16px;overflow:hidden;background:#fff}
.wx7-head{display:flex;justify-content:space-between;gap:10px;align-items:center;background:#eff6ff;color:var(--skyDark);font-size:12.5px;font-weight:950;line-height:1.35;padding:8px 10px;white-space:nowrap}
.wx7-row{display:grid;grid-template-columns:62px 32px minmax(0,1fr) auto;gap:7px;align-items:center;padding:8px 10px;border-top:1px solid #e5edf7;background:#fff;min-height:44px}
.wx7-row.today{background:#fff8d6}
.wx7-date{font-size:13.5px;font-weight:950;line-height:1.25;white-space:nowrap}
.wx7-icon{font-size:25px;line-height:1;text-align:center}
.wx7-main{font-size:14.5px;font-weight:850;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.wx7-pop{font-size:12.5px;font-weight:900;color:#2775a6;margin-left:4px;white-space:nowrap}
.wx7-temp{font-size:14.5px;font-weight:950;line-height:1.25;white-space:nowrap;text-align:right;letter-spacing:-.3px}
.wx7-temp .lo{color:#2563eb}.wx7-temp .hi{color:#dc2626}.wx7-temp .sep{color:#9aa6bb;margin:0 2px}

.notice{background:#fff7d6;border:1px solid #ffe08a;color:#5f4700;border-radius:14px;padding:13px 14px;font-size:14.5px;line-height:1.7;margin-bottom:13px}
.modal.weather-sheet{background:rgba(10,15,28,.5);backdrop-filter:blur(2px)}.modal.weather-sheet .modalBody{position:absolute;left:0;right:0;bottom:0;max-width:600px;min-height:0;max-height:86dvh;margin:0 auto;background:#fff;border-radius:24px 24px 0 0;padding:20px 20px calc(env(safe-area-inset-bottom,0px) + 20px);overflow-y:auto}.modal.weather-sheet .modalHead{background:#fff}

/* Compact GPS response strip: blue=recent position, green=checking, red=failed/stale. */
.location-strip{display:flex;align-items:center;gap:7px;width:100%;min-height:29px;height:33px;padding:2px 7px;margin:6px 0 7px;border:1px solid #dbe7f6;border-radius:10px;background:#fff;white-space:nowrap;overflow:hidden;box-shadow:0 2px 5px #20344b0b}
.location-dot{display:block;flex:none;width:17px;height:17px;border-radius:50%;background:#94a3b8;box-shadow:0 0 0 2px #94a3b826}
.location-strip.ok .location-dot{background:#0b5ed7;box-shadow:0 0 0 2px #0b5ed733;animation:location-breathe 2.2s ease-in-out infinite}
.location-strip.checking .location-dot{background:#16a34a;animation:location-blink .85s ease-in-out infinite}
.location-strip.error .location-dot{background:#e11d48;box-shadow:0 0 0 2px #e11d4822}
.location-label{font-size:13px;font-weight:900;flex:none;color:#172033}.location-status{font-size:12px;font-weight:750;color:#516174;min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis}.location-refresh{flex:none;width:26px;height:26px;padding:0;border:1px solid #cfe3ff;border-radius:8px;background:#f4f9ff;color:#084298;font-size:19px;font-weight:850;line-height:1}
@keyframes location-breathe{0%,100%{transform:scale(.85);opacity:.78}50%{transform:scale(1.18);opacity:1}}
@keyframes location-blink{0%,100%{opacity:1}50%{opacity:.27}}
@media(prefers-reduced-motion:reduce){.location-strip .location-dot{animation:none!important}}

/* Fixed bottom navigation: five equal slots in every tab, including the flight panel. */
html,body{max-width:100%;overflow-x:hidden}
.tabbar{position:fixed!important;inset:auto 0 0 0!important;width:100vw!important;max-width:100vw!important;box-sizing:border-box!important;display:grid!important;grid-template-columns:repeat(5,minmax(0,1fr))!important;overflow:hidden!important;z-index:1000!important;transform:translateZ(0);background:#fff}
.tabbar button{display:block!important;width:100%!important;min-width:0!important;max-width:100%!important;white-space:nowrap!important;overflow:hidden!important;font-size:clamp(11px,3.3vw,15px)!important;line-height:1.25!important}
main{padding-bottom:calc(110px + env(safe-area-inset-bottom))}
/* Requested legibility tweaks only on the three source-style home cards. */
.home-top-board .top-cell{border-width:2px;border-style:solid;min-height:63px;height:63px}
.home-top-board .top-label{font-size:clamp(14px,3.7vw,16px)}
.home-top-board .top-value,.home-top-board .top-cell.wx .top-value{font-size:clamp(17px,4.5vw,20px)}
.geo-address{font-size:13px;line-height:1.4;color:#4b6372;background:#f7fafc;border:1px solid #e0ebf1;border-radius:8px;padding:5px 8px;margin:-3px 0 8px;overflow-wrap:anywhere}
.location-strip.ok .location-dot{animation:location-breathe-slow 4.2s ease-in-out infinite}
@keyframes location-breathe-slow{0%,100%{transform:scale(.10);opacity:.07;box-shadow:none}50%{transform:scale(1.2);opacity:1;box-shadow:0 0 0 3px #0b5ed72f}}
@media(prefers-reduced-motion:reduce){.location-strip.ok .location-dot{animation:none}}

/* Readable body default. Source schedule headings/cards keep their hierarchy. */
#app p,#app .fact,#app .next,#app .muted,#app .source-day,#app .source-brief,#app .home-original,#modalContent p,#modalContent textarea{font-size:var(--type-body);font-weight:550;letter-spacing:var(--type-spacing);line-height:var(--type-line-height)}
#app h1,#app h2,#app h3,#app summary,#modalContent h2,#modalContent summary{line-height:var(--type-line-height)}

.home-original{margin-top:22px;padding-top:16px;border-top:3px solid #bed5cc;white-space:normal}
.source-day{margin-top:0;background:#fff;border:1px solid #dae4df;border-left:7px solid var(--source-color,#1c7ed6);border-radius:14px;padding:0;overflow:hidden;box-shadow:0 2px 8px #0000000d}
.source-day h2{display:block;font-size:var(--type-subtitle);padding:2px 10px;margin:0;background:color-mix(in srgb,var(--source-color,#1c7ed6) 14%,white);color:#19354b;border:0}
.source-day-heading{padding:9px 13px;color:var(--source-color,#1c7ed6);font-weight:850}
.source-day ul{padding:0 13px 0 32px;margin:0}.source-day li{padding:9px 4px;border-bottom:1px solid #e7eceb;font-size:var(--type-body);font-weight:550;line-height:var(--type-line-height);letter-spacing:0}
.source-meals{display:flex;gap:6px;flex-wrap:wrap;padding:10px 13px}.source-meals span{background:#e8efff;border-radius:8px;padding:5px 9px}.source-meals .meal-1{background:#e4f6e9}.source-meals .meal-2{background:#f2e7ff}
.source-hotel,.source-warning,.source-note{margin:9px 13px;padding:10px;border-radius:9px;background:color-mix(in srgb,var(--source-color,#1c7ed6) 12%,white);font-size:var(--type-body);line-height:var(--type-line-height)}.source-warning{background:#ffe3e0;color:#862d20}.source-note{background:#fff3d9}
.source-event{padding:11px 13px;margin-top:12px;border:1px solid #dbe9e2;border-radius:12px;background:#f5faf7;white-space:pre-line}.source-event>div{margin-top:7px}
.flight-section{border-left:6px solid #197199}.flight-section summary{font-size:var(--type-subtitle)}.flight-entry{padding:5px 0;border-top:1px solid #e8ecee}.flight-entry-title{font-size:var(--type-body);font-weight:800;margin-bottom:8px}.flight-fields{display:grid;grid-template-columns:minmax(0,1fr);gap:4px}.flight-chip{padding:5px 9px;border-radius:11px;background:#e8f2fb;min-width:0;overflow-wrap:anywhere;font-size:var(--type-body);font-weight:550;line-height:var(--type-line-height)}.flight-chip small{display:inline;font-size:13px;margin-right:8px;font-weight:800;color:#164e76;margin-bottom:0}.flight-chip.chip-1{background:#e7f5ea}.flight-chip.chip-2{background:#fff0db}.flight-chip.chip-3{background:#f0eafa}
@media(max-width:350px){.flight-fields{grid-template-columns:1fr}}
</style><style>html,body,body *{line-height:var(--type-line-height,1.2)!important}#app .source-day li,#app .flight-chip,#app .source-hotel,#app .source-warning,#app .source-note{letter-spacing:var(--type-spacing,0px)!important}</style>
</head><body><main><div class="top"><b>SK 여행</b><button id="tripTop" onclick="tab='manage';render()">여행 선택</button></div><div id="app"></div></main><nav class="tabbar" id="tabs"></nav><div id="modal" class="modal hidden"><div class="modalBody"><div class="modalHead row"><b id="modalTitle"></b><button class="soft" onclick="closeModal()">닫기 ✕</button></div><div id="modalContent"></div></div></div><script src="app.js"></script></body></html>
