<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SK-여행">
<meta name="theme-color" content="#6366f1">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>SK-여행 ✈️</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
:root{
  --bg:#eef1f8;
  --card:#ffffff;
  --ink:#1e2235;
  --ink2:#6b7280;
  --line:#e6e9f4;
  --pri:#6366f1;
  --pri2:#38bdf8;
  --coral:#ff6b6b;
  --mint:#10b981;
  --amber:#f59e0b;
  --grad:linear-gradient(135deg,#38bdf8 0%,#6366f1 55%,#7c3aed 100%);
  --shadow:0 6px 24px rgba(60,66,120,.10);
  --r:18px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  background:var(--bg);color:var(--ink);
  overscroll-behavior-y:none;
}
#phone{max-width:560px;margin:0 auto;min-height:100vh;position:relative;background:var(--bg)}
@media(min-width:600px){
  #phone{box-shadow:0 0 60px rgba(40,40,90,.15)}
  body{background:#dde3f0}
}

/* ---------- 헤더 ---------- */
#header{
  background:var(--grad);color:var(--hInk);
  padding:calc(env(safe-area-inset-top,0px) + 22px) 20px 26px;
  border-radius:0 0 28px 28px;
  box-shadow:0 10px 30px rgba(99,102,241,.35);
  position:sticky;top:0;z-index:50;
}
#header .h-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
#header .h-title{font-size:21px;font-weight:800;letter-spacing:-.3px}
#header .h-sub{font-size:12.5px;opacity:.88;margin-top:4px}
.dday{
  background:rgba(255,255,255,.22);backdrop-filter:blur(6px);
  border:1px solid rgba(255,255,255,.35);
  padding:7px 13px;border-radius:999px;font-size:13.5px;font-weight:700;white-space:nowrap;
}
.h-progress{margin-top:14px}
.h-progress .lbl{font-size:11.5px;opacity:.85;display:flex;justify-content:space-between;margin-bottom:5px}
.bar{height:7px;background:rgba(255,255,255,.28);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:#fff;border-radius:99px;transition:width .5s ease}

/* ---------- 메인 ---------- */
#main{padding:18px 16px calc(env(safe-area-inset-bottom,0px) + 96px)}
.sec-title{font-size:19px;font-weight:800;margin:6px 2px 4px;letter-spacing:-.3px}
.sec-desc{font-size:13px;color:var(--ink2);margin:0 2px 16px;line-height:1.55}
.card{
  background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);
  padding:16px;margin-bottom:14px;border:1px solid rgba(230,233,244,.8);
}

/* 버튼 */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  border:none;cursor:pointer;font-family:inherit;font-weight:700;
  border-radius:13px;font-size:14px;padding:11px 16px;transition:transform .08s ease, box-shadow .2s;
}
.btn:active{transform:scale(.96)}
.btn-pri{background:var(--grad);color:var(--btnInk);box-shadow:0 6px 16px rgba(99,102,241,.35)}
.btn-soft{background:#eef0ff;color:var(--pri)}
.btn-ghost{background:#f3f4f9;color:var(--ink2)}
.btn-danger{background:#fff0f0;color:var(--coral)}
.btn-block{width:100%;padding:14px}
.btn-sm{padding:8px 12px;font-size:12.5px;border-radius:10px}
.icon-btn{
  width:34px;height:34px;border-radius:10px;border:none;background:#f3f4f9;color:var(--ink2);
  font-size:14px;cursor:pointer;flex:none;display:inline-flex;align-items:center;justify-content:center;
}
.icon-btn:active{transform:scale(.92)}
.row{display:flex;gap:8px}
.row.wrap{flex-wrap:wrap}

/* 홈 퀵메뉴 */
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.quick .q{
  background:var(--card);border-radius:16px;padding:14px;box-shadow:var(--shadow);
  border:1px solid rgba(230,233,244,.8);cursor:pointer;
}
.quick .q .e{font-size:22px}
.quick .q .t{font-size:13px;font-weight:700;margin-top:8px}
.quick .q .d{font-size:11.5px;color:var(--ink2);margin-top:3px}
.empty{
  text-align:center;padding:34px 20px;color:var(--ink2);
}
.empty .e{font-size:40px;margin-bottom:10px}
.empty .t{font-weight:700;color:var(--ink);font-size:15px;margin-bottom:6px}
.empty .d{font-size:12.5px;line-height:1.6}

/* 배지/칩 */
.badge{display:inline-block;font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:99px;letter-spacing:.2px}
.b-dep{background:#e0f2fe;color:#0284c7}
.b-arr{background:#dcfce7;color:#16a34a}
.b-trf{background:#fef3c7;color:#b45309}
.b-hotel{background:#ede9fe;color:#7c3aed}
.b-rec{background:#fff1f2;color:#e11d48}

/* 아코디언 */
.acc{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden;border:1px solid rgba(230,233,244,.8)}
.acc-head{
  display:flex;align-items:center;gap:12px;padding:15px 16px;cursor:pointer;user-select:none;
}
.acc-head .grow{flex:1;min-width:0}
.acc-head .chev{color:#b6bbd0;font-size:13px;transition:transform .35s ease;flex:none}
.acc.open .acc-head .chev{transform:rotate(180deg)}
.acc-body{overflow:hidden;max-height:0;transition:max-height .4s ease}
.acc-inner{padding:4px 16px 16px}
.daynum{
  width:40px;height:40px;border-radius:13px;flex:none;
  background:var(--grad);color:var(--btnInk);font-weight:800;font-size:13px;
  display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.15;
}
.daynum.flat{background:#eef0ff;color:var(--pri)}
.acc-title{font-size:15px;font-weight:800;letter-spacing:-.2px}
.acc-sub{font-size:12px;color:var(--ink2);margin-top:2px}
.count-chip{font-size:11px;font-weight:800;color:var(--pri);background:#eef0ff;padding:4px 9px;border-radius:99px;flex:none}

/* 타임라인 (일정) */
.tl{position:relative;padding-left:20px;margin-top:8px}
.tl::before{content:'';position:absolute;left:6px;top:8px;bottom:14px;width:2px;background:var(--line);border-radius:2px}
.tl-item{position:relative;padding:9px 0 11px;display:flex;gap:10px;align-items:flex-start}
.tl-item::before{
  content:'';position:absolute;left:-19px;top:15px;width:9px;height:9px;border-radius:50%;
  background:var(--pri);border:2px solid #fff;box-shadow:0 0 0 2.5px #c7d2fe;
}
.tl-item.no-time::before{background:#cbd2e8;box-shadow:0 0 0 2.5px #e6e9f4}
.tl-time{
  flex:none;min-width:78px;font-size:12px;font-weight:800;color:var(--pri);
  background:#eef0ff;border-radius:9px;padding:5px 8px;text-align:center;margin-top:-1px;
}
.tl-time.na{color:#9aa0b8;background:#f3f4f9}
.tl-body{flex:1;min-width:0;font-size:14px;font-weight:600;line-height:1.45;word-break:keep-all;padding-top:2px}
.tl-acts{display:flex;gap:4px;flex:none}
.tl-acts .icon-btn{width:28px;height:28px;font-size:12px;background:transparent}

/* 체크리스트 */
.ck-cat{margin-bottom:12px}
.ck-head{display:flex;align-items:center;gap:8px;padding:2px 2px 9px}
.ck-head .name{font-size:15px;font-weight:800}
.ck-head .mini{margin-left:auto}
.ck-item{
  display:flex;align-items:center;gap:12px;padding:11px 13px;background:var(--card);
  border:1px solid var(--line);border-radius:14px;margin-bottom:7px;cursor:pointer;transition:background .2s;
}
.ck-item.done{background:#f6f8ff}
.ck-item .box{
  width:23px;height:23px;border-radius:8px;border:2px solid #c9cfe3;flex:none;
  display:flex;align-items:center;justify-content:center;font-size:13px;color:transparent;transition:all .2s;
}
.ck-item.done .box{background:var(--mint);border-color:var(--mint);color:#fff}
.ck-item .txt{flex:1;font-size:14px;font-weight:600}
.ck-item.done .txt{color:#a4aac2;text-decoration:line-through}
.ck-item .del{border:none;background:none;color:#c9cfe3;font-size:15px;cursor:pointer;padding:4px}

/* 정보 리스트 (공항/교통) */
.kv{display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.kv:last-child{border-bottom:none}
.kv .k{flex:none;width:86px;color:var(--ink2);font-weight:700}
.kv .v{flex:1;line-height:1.55;word-break:keep-all;white-space:pre-wrap}
.card-top{display:flex;align-items:flex-start;gap:10px;margin-bottom:6px}
.card-top .grow{flex:1;min-width:0}
.card-title{font-size:15.5px;font-weight:800;letter-spacing:-.2px}
.card-badges{display:flex;gap:5px;margin-top:5px;flex-wrap:wrap}

/* OCR 업로드 */
.ocr-zone{margin-bottom:14px}
.ocr-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ocr-btn{
  border:2px dashed #c9cfe3;background:#fafbff;border-radius:16px;padding:20px 10px;
  text-align:center;cursor:pointer;transition:border-color .2s,background .2s;font-family:inherit;
}
.ocr-btn:active{transform:scale(.97)}
.ocr-btn:hover{border-color:var(--pri);background:#f4f5ff}
.ocr-btn .e{font-size:26px}
.ocr-btn .t{font-size:13px;font-weight:800;margin-top:7px;color:var(--ink)}
.ocr-btn .d{font-size:11px;color:var(--ink2);margin-top:3px}
.ocr-prog{display:none;margin-top:12px;background:#f8f9ff;border-radius:14px;padding:13px 14px;border:1px solid var(--line)}
.ocr-prog .st{font-size:12.5px;font-weight:700;color:var(--pri);margin-bottom:8px;display:flex;justify-content:space-between}
.ocr-prog .bar{background:#e6e9f4}
.ocr-prog .bar>i{background:var(--grad)}
.ocr-preview{margin-top:12px;display:none}
.ocr-preview img{width:100%;border-radius:14px;border:1px solid var(--line)}
textarea.ta{
  width:100%;border:1.5px solid var(--line);border-radius:14px;padding:13px;font-family:inherit;
  font-size:13.5px;line-height:1.7;resize:vertical;min-height:150px;background:#fbfcff;color:var(--ink);
}
textarea.ta:focus,input:focus,select:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px rgba(99,102,241,.12)}
.step{display:flex;gap:10px;align-items:flex-start;margin-bottom:16px}
.step .n{
  width:24px;height:24px;border-radius:50%;background:var(--pri);color:var(--btnInk);flex:none;
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;
}
.step .tt{font-size:13.5px;font-weight:800;padding-top:2px}
.step .dd{font-size:12px;color:var(--ink2);margin-top:2px;line-height:1.5}

/* 폼 */
.f-lbl{font-size:12.5px;font-weight:800;color:var(--ink2);margin:14px 2px 6px}
.f-in,.f-sel{
  width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 13px;
  font-family:inherit;font-size:14.5px;background:#fbfcff;color:var(--ink);
}
.f-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* 바텀시트 */
#sheetWrap{position:fixed;inset:0;z-index:200;display:none}
#sheetWrap.show{display:block}
.sheet-bg{position:absolute;inset:0;background:rgba(20,22,40,.45);backdrop-filter:blur(2px);animation:fade .25s ease}
.sheet{
  position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;
  background:#fff;border-radius:24px 24px 0 0;padding:20px 20px calc(env(safe-area-inset-bottom,0px) + 20px);
  max-height:82vh;overflow-y:auto;animation:up .32s cubic-bezier(.2,.9,.3,1);
}
@keyframes up{from{transform:translateY(60%);opacity:.4}to{transform:translateY(0);opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet-title{font-size:17px;font-weight:800;margin-bottom:4px}
.sheet .row.btns{margin-top:20px}
.sheet .btn{flex:1;padding:14px}

/* 토스트 */
#toast{
  position:fixed;left:50%;transform:translateX(-50%) translateY(20px);
  bottom:calc(env(safe-area-inset-bottom,0px) + 100px);
  background:#23263d;color:#fff;font-size:13px;font-weight:600;
  padding:11px 18px;border-radius:99px;opacity:0;pointer-events:none;
  transition:all .3s ease;z-index:300;max-width:84%;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.25);
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* 앱 설치 플로팅 버튼 */
#installFab{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(env(safe-area-inset-bottom,0px) + 80px);z-index:150;
  border:none;border-radius:999px;padding:13px 22px;
  font-family:inherit;font-size:14px;font-weight:800;color:var(--btnInk);
  background:var(--grad);box-shadow:0 10px 26px rgba(99,102,241,.5);cursor:pointer;
  white-space:nowrap;animation:up .4s ease;
}
#installFab:active{transform:translateX(-50%) scale(.95)}


/* 테마 가변 변수 기본값 */
:root{ --hInk:#fff; --btnInk:#fff; }

/* 설정 화면 */
.set-row{display:flex;align-items:center;gap:12px;padding:13px 2px;cursor:pointer}
.set-row + .set-row{border-top:1px solid var(--line)}
.set-row .ic{font-size:20px;flex:none;width:28px;text-align:center}
.set-row .grow{flex:1;min-width:0}
.set-row .tt{font-size:14.5px;font-weight:800}
.set-row .dd{font-size:12px;color:var(--ink2);margin-top:2px}
.set-row .chev2{color:#b6bbd0;font-size:14px;flex:none}
.theme-dots{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:6px 0 4px}
.theme-dot{border:none;cursor:pointer;text-align:center;background:none;padding:0}
.theme-dot .c{width:100%;aspect-ratio:1/1;border-radius:16px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:16px;box-shadow:var(--shadow)}
.theme-dot .n{font-size:11px;font-weight:700;color:var(--ink2);margin-top:5px}
.theme-dot.on .c{outline:3px solid var(--pri);outline-offset:2px}

/* 정보 노트 카드 (알아둘 정보) */
.note-card{background:#fffdf5;border:1px solid #ffebb5;border-radius:12px;padding:12px 14px;margin-bottom:10px}
.note-card .nt{font-size:13.5px;font-weight:800;color:#8a6d00;margin-bottom:5px}
.note-card ul{margin:0;padding-left:18px}
.note-card li{font-size:13px;font-weight:600;line-height:1.75;color:#4a3f13}

/* 그룹 제목 (아코디언 안 소그룹) */
.grp{margin-bottom:6px}
.grp + .grp{border-top:2px dashed var(--line);padding-top:8px;margin-top:8px}
.grp-t{display:flex;align-items:center;justify-content:space-between;padding:4px 2px 8px}
.grp-t .nm{font-size:14px;font-weight:800;color:var(--pri)}

/* 저장된 메모 */
.memo-item{display:flex;justify-content:space-between;align-items:flex-start;background:#eef6ff;border:1px solid #cce0ff;border-radius:10px;padding:10px 12px;margin-bottom:7px;font-size:14px;font-weight:600;line-height:1.5;word-break:break-all}
.memo-del{flex:none;margin-left:8px;border:none;background:#ff6b6b;color:#fff;border-radius:8px;padding:5px 11px;font-size:12px;font-weight:800;cursor:pointer}

/* 헤더 톱니바퀴(설정) 버튼 */
.gear{width:36px;height:36px;border-radius:12px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.2);color:var(--hInk);font-size:16px;cursor:pointer;flex:none;display:inline-flex;align-items:center;justify-content:center}
.gear:active{transform:scale(.9) rotate(45deg)}

/* 하단 탭바 */
#tabbar{
  position:fixed;bottom:0;left:0;right:0;z-index:100;
  display:flex;justify-content:space-around;
  background:rgba(255,255,255,.94);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
  padding:6px 4px calc(env(safe-area-inset-bottom,0px) + 6px);
  max-width:560px;margin:0 auto;
}
.tab{
  flex:1;border:none;background:none;cursor:pointer;font-family:inherit;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:6px 0 4px;color:#9aa0b8;border-radius:14px;transition:color .2s;
}
.tab .ic{font-size:20px;filter:grayscale(1) opacity(.55);transition:all .2s}
.tab .lb{font-size:10.5px;font-weight:700}
.tab.on{color:var(--pri)}
.tab.on .ic{filter:none;transform:translateY(-2px)}
/* ===== v1.4 새 레이아웃: 얇은 상단바 + 큰 4박스 + 얇은 하단바 + 큰 글자(20pt 기준) ===== */
#main{zoom:1.8}
.sheet{zoom:1.8}
#toast{zoom:1.8}
#header{padding:calc(env(safe-area-inset-top,0px) + 4px) 10px 7px;border-radius:0;box-shadow:0 2px 12px rgba(20,20,50,.18)}
.h-slim{display:flex;align-items:center;justify-content:space-between;gap:8px;height:42px}
.h-brand{display:flex;align-items:center;gap:9px;min-width:0}
.h-brand .nm{font-size:16px;font-weight:800;letter-spacing:-.2px;color:var(--hInk);white-space:nowrap}
.h-back{background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.35);color:var(--hInk);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:800;cursor:pointer;white-space:nowrap;font-family:inherit}
.h-back:active{transform:scale(.94)}
.h-icons{display:flex;gap:7px;flex:none}
.h-ic{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.3);display:inline-flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;color:var(--hInk)}
.h-ic:active{transform:scale(.9)}
/* 큰 4박스 대시보드 */
.dash{display:flex;flex-direction:column;gap:13px;margin-top:8px}
.tile{border:none;font-family:inherit;text-align:left;border-radius:22px;padding:20px;box-shadow:var(--shadow);display:flex;align-items:center;gap:16px;cursor:pointer;width:100%}
.tile:active{transform:scale(.98)}
.tile .bx{width:58px;height:58px;border-radius:17px;flex:none;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.3);font-size:26px;font-weight:900}
.tile .grow{flex:1;min-width:0}
.tile .tt{font-size:19px;font-weight:800;letter-spacing:-.2px}
.tile .dd{font-size:12.5px;opacity:.88;margin-top:4px}
.tile .arr{font-size:34px;font-weight:300;opacity:.7;flex:none;line-height:1}
.t-air{background:linear-gradient(135deg,#38bdf8 0%,#6366f1 100%);color:#fff}
.t-sch{background:linear-gradient(135deg,#a78bfa 0%,#7c3aed 100%);color:#fff}
.t-trf{background:linear-gradient(135deg,#34d399 0%,#059669 100%);color:#fff}
.t-pack{background:linear-gradient(135deg,#FFCB05 0%,#f5a623 100%);color:#4a3200}
.t-pack .bx{background:rgba(255,255,255,.45)}
/* 하단 얇은 바: 내보내기/불러오기 — 글자는 아래 패치에서 교정 */
#tabbar{padding:0;justify-content:stretch}
.bb{flex:1;border:none;background:none;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:9px;font-size:16.5px;font-weight:800;color:var(--ink);padding:15px 0 calc(env(safe-area-inset-bottom,0px) + 13px);cursor:pointer}
.bb+.bb{border-left:1px solid var(--line)}
.bb:active{background:#eef1fb}
/* 일정 입력 3버튼 */
.ocr-btns.btns3{grid-template-columns:1fr 1fr 1fr}
@media(max-width:380px){.ocr-btn .d{display:none}}

</style>
</head>
<body>
<div id="phone">
  <header id="header"></header>
  <main id="main"></main>
  <nav id="tabbar"></nav>
</div>
<div id="sheetWrap"></div>
<div id="toast"></div>

const pad2 = n => String(n).padStart(2, '0');
const WEEKS = ['일','월','화','수','목','금','토'];

function addDaysISO(iso, n){ const d = new Date(iso + 'T00:00:00'); d.setDate(d.getDate() + n);

function fmtDate(iso){ if(!iso) return ''; const d = new Date(iso + 'T00:00:00');
  return (d.getMonth()+1) + '/' + d.getDate() + ' (' + WEEKS[d.getDay()] + ')'; }
function fmtFull(iso){ if(!iso) return ''; const d = new Date(iso + 'T00:00:00');
  return d.getFullYear() + '년 ' + (d.getMonth()+1) + '월 ' + d.getDate() + '일 (' + WEEKS[d.getDay()] + ')'; }

let state = store.load() || defaultState();

/* 시드 버전 관리: 체크리스트가 업데이트되면 숫자를 올려 자동 교체 */
const SEED_VERSION = 3;
let justUpgradedSeed = false;
if (!state.seedVersion || state.seedVersion < SEED_VERSION){
  state.packing = defaultPacking();
  state.memos = Array.isArray(state.memos) ? state.memos : [];
  state.packOpen = Array.isArray(state.packOpen) ? state.packOpen : [];
  state.settings = Object.assign({ theme: 'indigo', startTab: 'home' }, state.settings || {});
  state.seedVersion = SEED_VERSION;
  justUpgradedSeed = true;
  store.save(state);
}

/* ---------------- 토스트 ---------------- */
let toastTimer = null;
function toast(msg){
  const t = $('#toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ---------------- 바텀시트 ---------------- */
function openSheet(title, fieldsHTML, onSave, saveLabel){
  const wrap = $('#sheetWrap');
  wrap.innerHTML =
    '<div class="sheet-bg" data-action="sheet-close"></div>' +
    '<div class="sheet">' +
      '<div class="sheet-title">' + esc(title) + '</div>' +
      '<form id="sheetForm" novalidate>' + fieldsHTML +
        '<div class="row btns">' +
          '<button type="button" class="btn btn-ghost" data-action="sheet-close">취소</button>' +
          '<button type="submit" class="btn btn-pri">' + esc(saveLabel || '저장') + '</button>' +
        '</div>' +
      '</form>' +
    '</div>';
  wrap.classList.add('show');
  $('#sheetForm').addEventListener('submit', e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const values = {};
    for (const [k, v] of fd.entries()) values[k] = v.trim();
    onSave(values);
    closeSheet();
  });
  const first = wrap.querySelector('input,textarea,select');
  if (first) setTimeout(() => first.focus(), 250);
}
function closeSheet(){ $('#sheetWrap').classList.remove('show'); $('#sheetWrap').innerHTML = ''; }
function fField(label, name, value, type, placeholder){
  return '<div class="f-lbl">' + esc(label) + '</div>' +
    '<input class="f-in" type="' + (type || 'text') + '" name="' + name + '" value="' + esc(value || '') +
    '" placeholder="' + esc(placeholder || '') + '">';
}
function fArea(label, name, value, placeholder){
  return '<div class="f-lbl">' + esc(label) + '</div>' +
    '<textarea class="ta" name="' + name + '" style="min-height:90px" placeholder="' + esc(placeholder || '') + '">' + esc(value || '') + '</textarea>';
}
function fSelect(label, name, value, options){
  let h = '<div class="f-lbl">' + esc(label) + '</div><select class="f-sel" name="' + name + '">';
  options.forEach(o => { h += '<option value="' + esc(o.v) + '"' + (o.v === value ? ' selected' : '') + '>' + esc(o.t) + '</option>'; });
  return h + '</select>';
}

/* ---------------- 렌더: 헤더 ---------------- */
function ddayText(){
  if (!state.trip.start) return '';
  const today = new Date(); const t = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  const s = new Date(state.trip.start + 'T00:00:00');
  const diff = Math.round((s - t) / 864e5);
  if (diff > 0) return '✈️ D-' + diff;
  if (diff === 0) return '🎉 D-Day!';
  if (state.trip.end){ const e = new Date(state.trip.end + 'T00:00:00');
    if (t <= e) return '🌍 여행 ' + (Math.round((t - s) / 864e5) + 1) + '일차'; }
  return '✅ 여행 완료';
}
function packingStats(){
  let total = 0, done = 0;
  state.packing.forEach(sec => { if (sec.groups) sec.groups.forEach(g => g.items.forEach(i => { total++; if (i.done) done++; })); });
  return { total, done, pct: total ? Math.round(done / total * 100) : 0 };
}
function packEachItem(fn){
  state.packing.forEach(sec => { if (sec.groups) sec.groups.forEach(g => g.items.forEach(it => fn(it, g, sec))); });
}
function packFindGroup(id){
  for (const sec of state.packing){ if (sec.groups){ const g = sec.groups.find(x => x.id === id); if (g) return g; } }
  return null;
}

function sortedDays(){
  return [...state.schedule].sort((a, b) => {
    if (a.date && b.date) return a.date < b.date ? -1 : 1;
    if (a.date) return -1; if (b.date) return 1; return 0;
  });
}
function sortedEvents(d){
  return [...d.events].sort((a, b) => (a.time || '99') < (b.time || '99') ? -1 : 1);
}
function shortDayLabel(d, idx){
  let n = String(idx + 1);
  if (/일차/.test(d.label)){ const m = d.label.match(/(\d+)/); if (m) n = m[1]; }
  let t;
  if (d.label === '날짜 미지정') t = d.date ? fmtDate(d.date) + ' 일정' : '날짜 미정 일정';
  else t = /(일차|일)$/.test(d.label) ? d.label + ' 일정' : d.label;
  const s = d.date ? fmtDate(d.date) : '날짜 미정';
  return { n: n, t: t, s: s };
}

/* ---------------- OCR ---------------- */
const OCR_STATUS = {
  'loading tesseract core': 'OCR 엔진 불러오는 중…',
  'initializing tesseract': '엔진 준비 중…',
  'loading language traineddata': '한국어 인식 데이터 다운로드 중 (최초 1회)…',
  'initializing api': '인식 준비 중…',
  'recognizing text': '이미지에서 글자 읽는 중…'
};
function ocrUi(show, status, pct){
  const p = $('#ocrProg'); if (!p) return;
  p.style.display = show ? 'block' : 'none';
  if (status) $('#ocrStatus').textContent = status;
  if (pct != null){ $('#ocrBar').style.width = Math.round(pct * 100) + '%'; $('#ocrPct').textContent = Math.round(pct * 100) + '%'; }
}
async function runOCR(file){
  const prev = $('#ocrPreview');
  if (prev){ prev.style.display = 'block'; prev.innerHTML = '<img alt="스캔 이미지" src="' + URL.createObjectURL(file) + '">'; }
  ocrUi(true, 'OCR 엔진 준비 중…', 0);
  if (typeof Tesseract === 'undefined'){
    ocrUi(true, '⚠️ 지금은 OCR을 쓸 수 없어요 (네트워크 필요). 아래 칸에 텍스트를 직접 붙여넣어 주세요.', 0);
    return;
  }
  try {
    const worker = await Tesseract.createWorker('kor+eng', 1, {
      logger: m => {
        if (m.status === 'recognizing text') { ocrUi(true, OCR_STATUS[m.status]); ocrUi(true, null, m.progress); }
        else if (OCR_STATUS[m.status]) ocrUi(true, OCR_STATUS[m.status]);
      }
    });
    const ret = await worker.recognize(file);
    await worker.terminate();
    const text = ret.data.text.trim();
    ocrUi(true, '✅ 인식 완료! 아래 텍스트를 확인해 주세요.', 1);
    const ta = $('#ocrText');
    if (ta){ ta.value = ta.value.trim() ? ta.value.trim() + '\n' + text : text; toast('글자 인식 완료! 수정 후 변환을 눌러 주세요 ✨'); }
  } catch (err) {
    ocrUi(true, '⚠️ 인식에 실패했어요. 더 선명한 사진으로 다시 시도하거나 텍스트를 직접 넣어 주세요.', 0);
  }
}

/* ---------------- 텍스트 → 일정 파서 ---------------- */
function matchDayHeader(line, baseYear){
  let m = line.match(/^(?:\[?\s*day\s*0*(\d{1,2})\s*\]?)(.*)$/i);
  if (m && headerRestOK(m[2])) return { label: (+m[1]) + '일차', date: state.trip.start ? addDaysISO(state.trip.start, +m[1] - 1) : '' };
  m = line.match(/^(\d{1,2})\s*일차(.*)$/);
  if (m && headerRestOK(m[2])) return { label: (+m[1]) + '일차', date: state.trip.start ? addDaysISO(state.trip.start, +m[1] - 1) : '' };
  m = line.match(/(\d{4})\s*[.\-\/년]\s*(\d{1,2})\s*[.\-\/월]\s*(\d{1,2})\s*일?(.*)$/);
  if (m && headerRestOK(m[4])) return { label: (+m[2]) + '월 ' + (+m[3]) + '일', date: m[1] + '-' + pad2(+m[2]) + '-' + pad2(+m[3]) };
  m = line.match(/^(\d{1,2})\s*(?:월|\.)\s*(\d{1,2})\s*일?(.*)$/) || line.match(/^(\d{1,2})\s*\/\s*(\d{1,2})(.*)$/);
  if (m && headerRestOK(m[3])) return { label: (+m[1]) + '월 ' + (+m[2]) + '일', date: baseYear + '-' + pad2(+m[1]) + '-' + pad2(+m[2]) };
  return null;
}
function headerRestOK(rest){
  const r = (rest || '').replace(/[\s\(\)\[\],·:\-~월화수목금토일요일]/g, '');
  return r.length <= 3;
}
function extractTime(line){
  let time = '', title = line;
  let m = line.match(/^(오전|오후)?\s*(\d{1,2})\s*시\s*(\d{1,2})?\s*분?/);
  if (m && (m[1] || /시/.test(line))){
    let h = +m[2];
    if (m[1] === '오후' && h < 12) h += 12;
    if (m[1] === '오전' && h === 12) h = 0;
    if (h <= 24){ time = pad2(h % 24) + ':' + pad2(m[3] ? +m[3] : 0);
      title = line.slice(m[0].length); }
  } else {
    m = line.match(/\b([01]?\d|2[0-3]):([0-5]\d)\b/);
    if (m){
      time = m[0];
      let consumed = m[0].length;
      const after = line.slice(m.index + consumed);
      const rm = after.match(/^\s*[~\-–]\s*([01]?\d|2[0-3]):([0-5]\d)\b/);
      if (rm){ time += '~' + rm[0].replace(/^\s*[~\-–]\s*/, ''); consumed += rm[0].length; }
      title = (line.slice(0, m.index) + ' ' + line.slice(m.index + consumed));
    }
  }
  title = title.replace(/[\[\]\(\)]/g, ' ').replace(/^[:\-–~\s,.]+/, '').replace(/\s{2,}/g, ' ').trim();
  return { time, title: title || line.trim() };
}
function parseScheduleText(raw){
  const baseYear = (state.trip.start ? new Date(state.trip.start + 'T00:00:00') : new Date()).getFullYear();
  const lines = raw.split(/\r?\n/)
    .map(l => l.replace(/^[\s\-\*\•·▶▷▫◦◇•※]+/, '').replace(/^\d+[.)]\s+/, '').trim())
    .filter(Boolean);
  const days = [];
  let cur = null;
  lines.forEach(line => {
    const hdr = matchDayHeader(line, baseYear);
    if (hdr){
      cur = days.find(d => d.label === hdr.label || (hdr.date && d.date === hdr.date)) || null;
      if (!cur){ cur = { id: uid(), label: hdr.label, date: hdr.date, events: [] }; days.push(cur); }
      else if (hdr.date && !cur.date) cur.date = hdr.date;
      return;
    }
    if (!cur){ cur = { id: uid(), label: '날짜 미지정', date: '', events: [] }; days.push(cur); }
    const { time, title } = extractTime(line);
    cur.events.push({ id: uid(), time, title });
  });
  return days.filter(d => d.events.length || d.label !== '날짜 미지정');
}

    openSheet('앱 시작 화면', fSelect('앱을 켰을 때 처음 보이는 탭', 'tab', (state.settings || {}).startTab || 'home', TABS.map(t => ({ v: t.id, t: t.ic + ' ' + t.lb }))),
      v => { state.settings.startTab = v.tab; save(); keepScroll(renderMain); toast('저장했어요'); });
  },
  'set-install'(){
    if (deferredInstall){ deferredInstall.prompt(); deferredInstall = null; }
    else toast("크롬 ⋮ 메뉴 → '앱 설치'를 이용하세요 (이미 설치됐을 수도 있어요)");
  },
  'data-reset'(){
    if (!confirm('⚠️ 모든 데이터(체크 · 일정 · 메모 · 설정)를 삭제하고 초기화할까요?\n이 작업은 되돌릴 수 없어요!')) return;
    try {
      localStorage.removeItem(LS_KEY);
      const rm = [];
      for (let i = 0; i < localStorage.length; i++){
        const k = localStorage.key(i);
        if (k && k.indexOf('travel_v4_') === 0) rm.push(k);
      }
      rm.forEach(k => localStorage.removeItem(k));
    } catch (e) {}
    memFallback = null;
    state = defaultState(); state.seedVersion = SEED_VERSION;
    ui.tab = 'home'; ui.openDays = new Set(); ui.openAir = new Set();
    save(); applySettings(); renderAll(); toast('초기화 완료! 새로 시작해요 🌱');
  },
};

/* ----- 공항 폼 ----- */
function airportForm(a){
  const isNew = !a;
  a = a || { type: 'dep', name: '', terminal: '', checkin: '', facility: '', wifi: '', tips: '' };
  openSheet(isNew ? '공항 추가' : '공항 수정',
    fSelect('구분', 'type', a.type, [
      { v: 'dep', t: '🛫 출발 공항' }, { v: 'arr', t: '🛬 도착 공항' }, { v: 'trf', t: '🔄 경유 공항' }
    ]) +
    fField('공항 이름', 'name', a.name, 'text', '예: 나리타공항 제1터미널') +
    fField('터미널 / 항공사', 'terminal', a.terminal, 'text', '예: 제1터미널 · 대한항공') +
    fArea('체크인 · 수하물', 'checkin', a.checkin, '예: 카운터 K열, 출발 3시간 전 오픈') +
    fArea('라운지 · 면세점 · 편의시설', 'facility', a.facility, '예: 4F 라운지, 면세 픽업 위치') +
    fArea('Wi-Fi · 환전 · 심카드', 'wifi', a.wifi, '예: 공용 WiFi 이름, 환전소 위치') +
    fArea('팁 · 주의사항', 'tips', a.tips, '예: 면세 한도, 기내 반입 규정'),
    v => {
      if (isNew) { state.airports.push({ id: uid(), ...v }); }
      else Object.assign(a, v);
      save(); keepScroll(renderMain); toast('저장했어요 🛫');
    });
}
/* ----- 교통 폼 ----- */
function transferForm(t){
  const isNew = !t;
  t = t || { mode: MODES[0], name: '', duration: '', cost: '', where: '', interval: '', note: '', rec: false };
  openSheet(isNew ? '이동 방법 추가' : '이동 방법 수정',
    fSelect('교통수단', 'mode', t.mode, MODES.map(m => ({ v: m, t: m }))) +
    fField('이름', 'name', t.name, 'text', '예: 공항리무진 602번') +
    '<div class="f-2"><div>' + fField('소요시간', 'duration', t.duration, 'text', '약 70분') + '</div>' +
    '<div>' + fField('비용', 'cost', t.cost, 'text', '1,600엔') + '</div></div>' +
    fField('승차 위치', 'where', t.where, 'text', '예: 1층 도착로비 15번 승강장') +
    fField('배차 간격 / 운행시간', 'interval', t.interval, 'text', '예: 30분 간격, 06:00~23:00') +
    fArea('메모 · 예약 링크', 'note', t.note, '예: 간사이 패스 사용 가능 / 예약 사이트'),
    v => { v.rec = t.rec;
      if (isNew) state.transfers.push({ id: uid(), ...v }); else Object.assign(t, v);
      save(); keepScroll(renderMain); toast('저장했어요 🚌'); });
}
/* ----- 일정 이벤트 폼 ----- */
function eventForm(dayId, eventId){
  const d = state.schedule.find(x => x.id === dayId); if (!d) return;
  const ev = eventId ? d.events.find(e => e.id === eventId) : null;
  openSheet(eventId ? '일정 수정' : '일정 추가',
    fField('시간 (선택)', 'time', ev ? ev.time : '', 'text', '예: 14:30 또는 14:30~16:00') +
    fField('내용', 'title', ev ? ev.title : '', 'text', '예: 호텔 체크인'),
    v => { if (!v.title) return;
      if (ev) { ev.time = v.time; ev.title = v.title; }
      else d.events.push({ id: uid(), time: v.time, title: v.title });
      save(); keepScroll(renderMain); toast('저장했어요 📌'); });
}

/* ---------------- 아코디언 토글 ---------------- */
function toggleAcc(headEl, id, openSet){
  const acc = headEl.closest('.acc');
  const body = acc.querySelector('.acc-body');
  const isOpen = acc.classList.contains('open');
  if (isOpen){
    body.style.maxHeight = body.scrollHeight + 'px';
    requestAnimationFrame(() => { requestAnimationFrame(() => { body.style.maxHeight = '0px'; }); });
    acc.classList.remove('open'); openSet.delete(id);
  } else {
    acc.classList.add('open'); openSet.add(id);
    body.style.maxHeight = body.scrollHeight + 'px';
    const onEnd = e => { if (e.propertyName === 'max-height' && acc.classList.contains('open')) body.style.maxHeight = 'none';
      body.removeEventListener('transitionend', onEnd); };
    body.addEventListener('transitionend', onEnd);
  }
}

/* ---------------- 전역 이벤트 ---------------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const fn = actions[el.dataset.action];
  if (fn) fn(el.dataset.id, el, e);
});
document.addEventListener('change', e => {
  const id = e.target.id;
  if (id === 'camInput' || id === 'imgInput'){
    const f = e.target.files[0];
    if (f) runOCR(f);
    e.target.value = '';
  }
  if (id === 'importFile'){
    const f = e.target.files[0];
    if (f){
      const rd = new FileReader();
      rd.onload = () => {
        try {
          let data = JSON.parse(rd.result);
          if (data && data.state){
            try {
              Object.keys(data.travel_v4 || {}).forEach(k => { if (k.indexOf('travel_v4_') === 0) localStorage.setItem(k, data.travel_v4[k]); });
            } catch (e2) {}
            data = data.state;
          }
          if (!data || typeof data !== 'object' || !Array.isArray(data.packing)) throw 0;
          state = Object.assign(defaultState(), data);
          state.settings = Object.assign({ theme: 'indigo', startTab: 'home' }, state.settings || {});
          state.memos = Array.isArray(state.memos) ? state.memos : [];
          state.packOpen = Array.isArray(state.packOpen) ? state.packOpen : [];
          save(); applySettings(); renderAll(); toast('불러오기 완료! 🎉');
        } catch (err) { toast('올바른 백업 파일이 아니에요'); }
      };
      rd.readAsText(f);
    }
    e.target.value = '';
  }
});

/* ---------------- PWA: 서비스 워커 등록 ---------------- */
if ('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}

/* ---------------- PWA: 앱 설치 버튼 ---------------- */
let deferredInstall = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredInstall = e;
});
window.addEventListener('appinstalled', () => {
  toast('앱이 설치됐어요! 홈 화면을 확인해 보세요 🎉');
});


if (state.settings && state.settings.startTab) ui.tab = state.settings.startTab;
if (ui.tab === 'packing'){ location.replace('packing.html'); }
applySettings();
renderAll();
if (justUpgradedSeed) setTimeout(() => toast('🎒 체크리스트가 내 여행 스타일로 업데이트됐어요! (체크 초기화됨)'), 600);
</script>
