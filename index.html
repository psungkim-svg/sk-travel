<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17644e"><link rel="manifest" href="manifest.json"><link rel="icon" href="icons/favicon-32.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><title>SK 여행 · 현장 가이드</title><style>
:root{--ink:#172c32;--green:#17644e;--muted:#5d7174;--line:#dce7e2}*{box-sizing:border-box}body{margin:0;background:#f3f7f5;color:var(--ink);font-family:system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;font-size:15px}button,input,textarea,select{font:inherit}button{cursor:pointer}main{max-width:740px;margin:auto;padding:14px 15px 100px}.top{display:flex;align-items:center;justify-content:space-between;padding:5px 0 12px}.top b{font-size:21px}.top button,.soft{background:#e1f0e8;color:#145941;border:1px solid #bcd8c9;border-radius:10px;padding:9px 11px;font-weight:750}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.tile{border-radius:15px;padding:12px 4px;min-height:85px;text-align:center;background:#e3eff5}.tile:nth-child(2){background:#dcefe4}.tile:nth-child(3){background:#edf1de}.tile small{display:block;color:#405b61;font-size:11px;line-height:1.3}.tile b{font-size:17px;display:block;margin:10px 0 0}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:17px;margin:11px 0;box-shadow:0 2px 9px #173e2c09}.row{display:flex;align-items:center;justify-content:space-between;gap:9px}.muted{color:var(--muted);font-size:13px;line-height:1.5}.eyebrow{color:var(--green);font-size:12px;font-weight:800}h1{font-size:22px;margin:7px 0}h2{font-size:19px;margin:0 0 12px}h3{font-size:16px;margin:9px 0}.nav{display:grid;grid-template-columns:1fr 1.1fr 1fr;gap:6px;margin:17px 0 12px}.nav button{border:1px solid #bad2c7;background:white;color:var(--green);border-radius:11px;padding:11px 2px;font-size:12px;font-weight:800}.nav button:nth-child(2),.primary{border:0;background:var(--green);color:white;border-radius:11px;padding:11px 13px;font-weight:800}.photo{width:100%;height:210px;object-fit:cover;border-radius:13px;background:#e9f0eb}.emptyPhoto{min-height:130px;background:#ecf3ef;border:1px dashed #9db6a8;border-radius:13px;display:grid;place-items:center;color:#526e62;text-align:center;padding:16px}.thumbs{display:flex;gap:6px;margin-top:7px;overflow:auto}.thumbs img{height:64px;width:80px;object-fit:cover;border-radius:7px;cursor:pointer}.fact{padding:10px 0;border-bottom:1px solid #e8efeb;line-height:1.5}.fact b{color:#195947}.next{background:#e7f3eb;border-radius:12px;padding:12px;line-height:1.5;margin-top:12px}details{margin:10px 0;border:1px solid var(--line);border-radius:13px;padding:13px;background:#fff}summary{font-weight:800;cursor:pointer}details details{background:#f7faf8}.trip{border:1px solid var(--line);border-radius:13px;padding:12px;margin:9px 0}.trip.active{border:2px solid var(--green);background:#f0f8f2}.actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.actions button{border:1px solid #bad2c7;border-radius:9px;background:#fff;color:#175c45;padding:8px;font-size:12px;font-weight:750}.actions button.active{background:var(--green);color:#fff}.danger{color:#aa3e2e!important}.warning{color:#ad3829;font-weight:750}.alert{background:#fff0e9;border-left:4px solid #d05a38;padding:10px;margin:10px 0;border-radius:6px}.banner{background:#fff0c9;color:#654500;padding:10px;border-radius:10px;margin-bottom:10px}.toolbar{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.toolbar button{border:1px solid #bdd4ca;border-radius:9px;background:white;padding:9px;color:var(--green);font-weight:700}.field{display:block;font-weight:750;font-size:13px;margin:12px 0}.field input,.field textarea,.field select{width:100%;border:1px solid #b8c9c0;border-radius:9px;padding:11px;margin-top:5px;background:white;color:var(--ink)}textarea{min-height:105px;resize:vertical}.small{font-size:12px;color:var(--muted)}.tabbar{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid var(--line);display:flex;justify-content:center;padding:8px 0 max(10px,env(safe-area-inset-bottom));z-index:4}.tabbar button{width:min(20%,145px);border:0;background:white;color:#627971;font-size:12px;padding:8px 1px;font-weight:750}.tabbar button.on{color:var(--green);border-top:3px solid var(--green)}.modal{position:fixed;inset:0;background:#f4f8f6;z-index:10;overflow:auto}.modalBody{max-width:740px;margin:auto;padding:18px 16px 80px}.modalHead{position:sticky;top:0;background:#f4f8f6;padding:10px 0;border-bottom:1px solid var(--line);z-index:1}.pill{background:#edf3ee;padding:4px 8px;border-radius:20px;font-size:12px}.iframe{width:100%;min-height:74vh;border:0;background:white;border-radius:12px}.hidden{display:none!important}
</style></head><body><main><div class="top"><b>SK 여행</b><button id="tripTop" onclick="tab='manage';render()">여행 선택</button></div><div id="app"></div></main><nav class="tabbar" id="tabs"></nav><div id="modal" class="modal hidden"><div class="modalBody"><div class="modalHead row"><b id="modalTitle"></b><button class="soft" onclick="closeModal()">닫기 ✕</button></div><div id="modalContent"></div></div></div><script src="app.js"></script></body></html>
