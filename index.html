<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SK-여행">

<link rel="manifest" href="manifest.json">

<title>SK-여행 ✈️</title>
<style>
:root{
  --bg:#f2f5f9; --card:#fff; --ink:#172033; --ink2:#667085; --line:#e3e8f2;
  --dark:#0b5ed7; --dark2:#084298; --yellow:#FFCB05; --yellowInk:#4a3200;
  --sky:#0ea5e9; --skyDark:#0369a1; --mint:#0f9d58; --coral:#e5484d; --amber:#d97706;
  --shadow:0 5px 18px rgba(22,34,66,.08); --r:18px; --appzoom:1.15;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;background:#dbe2ee;color:var(--ink)}
button,input,select,textarea{font-family:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid rgba(14,165,233,.45);outline-offset:2px}
#phone{max-width:600px;height:100dvh;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);position:relative;box-shadow:0 0 55px rgba(15,23,42,.25)}
/* 상단바 (짙은 색) */
#header{background:var(--dark);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 7px) 12px 8px;flex:none;z-index:50;box-shadow:0 3px 14px rgba(15,23,42,.28)}
.h-row{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:42px}
.h-brand{display:flex;align-items:center;gap:9px;min-width:0}
.h-title{font-size:19px;font-weight:900;letter-spacing:-.3px;white-space:nowrap}
.h-back{border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.13);color:#fff;border-radius:999px;padding:8px 13px;font-size:14px;font-weight:800;white-space:nowrap}
.h-gear{width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.26);background:rgba(255,255,255,.13);color:#fff;font-size:19px;flex:none}
.h-back:active,.h-gear:active{transform:scale(.93)}
/* 본문 */
#main{flex:1;overflow-y:auto;overscroll-behavior:contain;min-height:0}
#main.packing-main{overflow:hidden}
.view{padding:14px 13px 24px;zoom:var(--appzoom)}
.view.packing-view{padding:0;height:100%;zoom:1}
.packing-frame{width:100%;height:100%;border:0;display:block;background:#f5f7fb}
.airhotel-tabs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;background:#e7f1ff;border:1px solid #cfe4ff;padding:5px;border-radius:999px;margin:2px 0 15px}
.airhotel-tabs button{border:0;border-radius:999px;padding:12px 3px;background:transparent;font-size:15.5px;font-weight:950;color:#31527a;white-space:nowrap}
.airhotel-tabs button.on{background:var(--dark);color:#fff;box-shadow:0 5px 14px rgba(11,94,215,.32)}
.airhotel-tabs button:active{transform:scale(.96)}
.flight-route{font-size:20px;font-weight:950;line-height:1.45;word-break:keep-all;margin:2px 0 8px}
.secret-actions{display:flex;gap:7px;margin:9px 0 0}
.secret-actions .icon-btn{width:42px;height:38px;border-radius:11px;font-size:15px}
.stay-row{display:block;padding:14px 0;border-bottom:1px dashed var(--line)}
.stay-row:last-child{border-bottom:0}
.stay-date{display:block;width:100%;background:#e7f1ff;color:#084298;border-radius:12px;padding:10px 12px;text-align:left;font-size:15px;font-weight:950;line-height:1.5;margin-bottom:8px}
.stay-row .hotel-name{font-size:17px;font-weight:950;line-height:1.4;word-break:keep-all}
.stay-row .hotel-sub{font-size:14.5px;color:var(--ink2);line-height:1.65;margin-top:5px;word-break:keep-all;overflow-wrap:anywhere}
.view.schedule-original-view{padding:10px 10px 0;height:100%;display:flex;flex-direction:column;zoom:1}
.schedule-mode{display:flex;gap:6px;margin-bottom:9px;flex:none}
.schedule-mode button{flex:1;border:0;border-radius:999px;padding:11px;background:#fff;box-shadow:var(--shadow);font-weight:900;font-size:14.5px;color:#526077}
.schedule-mode button.on{background:var(--dark);color:var(--yellow)}
.schedule-original-frame{flex:1;width:100%;min-height:0;border:0;display:block;background:#f2f5f7}
.home-top-board{display:grid;grid-template-columns:.9fr 1fr 1.2fr;gap:8px;margin:0 -6px 10px}
.top-swap{transition:opacity .22s ease,transform .22s ease;will-change:opacity,transform}.home-top-board.is-switching .top-swap{opacity:.22;transform:translateY(3px)}@media (prefers-reduced-motion: reduce){.top-swap{transition:none}.home-top-board.is-switching .top-swap{opacity:1;transform:none}}
.top-cell{display:flex;flex-direction:column;justify-content:center;border:1px solid #dbe7f6;background:#fff;border-radius:14px;padding:0;min-width:0;height:57px;overflow:hidden;box-shadow:0 3px 10px rgba(22,34,66,.08);text-align:center;color:var(--ink);width:100%;transition:background-color .35s ease,color .35s ease,border-color .35s ease}
.top-cell.home{background:var(--dark);color:#fff;border-color:var(--dark)}
.top-cell.dest{background:#e9f6ff}
.top-cell.wx{background:#fff8d6;border-color:#ffe58a;cursor:pointer}
.top-cell.wx:active{transform:scale(.98)}
.top-cell.tone-morning{background:#dff3ff;border-color:#b9def8;color:#12325b}
.top-cell.tone-day{background:#0b5ed7;border-color:#084298;color:#fff}
.top-cell.tone-night{background:#000;border-color:#000;color:#fff}
.top-label{font-size:clamp(12px,3.35vw,14px);font-weight:750;line-height:1.2;opacity:.92;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.65px}
.top-value{font-size:clamp(14px,4vw,17px);font-weight:950;line-height:1.16;margin-top:0;letter-spacing:-.7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.top-cell .top-swap{width:100%}
.top-cell .top-label,.top-cell .top-value,.top-cell .top-sub{width:100%;text-align:center}
.top-cell.dest .top-label,.top-cell.wx .top-label{font-size:clamp(12px,3.35vw,14px);letter-spacing:-.75px}
.top-cell.wx .top-value{font-size:clamp(14px,4vw,17px);letter-spacing:-.75px}
.top-sub{font-size:12px;font-weight:800;line-height:1.2;margin-top:0;opacity:.84;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.6px}
.stack-item{padding:11px 0;border-bottom:1px dashed var(--line)}
.stack-item:last-child{border-bottom:0}
.stack-k{font-size:14px;font-weight:950;color:var(--skyDark);margin-bottom:4px;line-height:1.45}
.stack-v{font-size:16px;font-weight:750;line-height:1.65;color:var(--ink);white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.now-context{font-size:15px;font-weight:950;color:var(--skyDark);margin:-3px 0 8px}
.wx7{border:1px solid #dbeafe;border-radius:16px;overflow:hidden;background:#fff}
.wx7-head{display:flex;justify-content:space-between;gap:10px;align-items:center;background:#eff6ff;color:var(--skyDark);font-size:12.5px;font-weight:950;line-height:1.35;padding:8px 10px;white-space:nowrap}
.wx7-row{display:grid;grid-template-columns:62px 32px minmax(0,1fr) auto;gap:7px;align-items:center;padding:8px 10px;border-top:1px solid #e5edf7;background:#fff;min-height:44px}
.wx7-row.today{background:#fff8d6}
.wx7-date{font-size:13.5px;font-weight:950;line-height:1.25;white-space:nowrap}
.wx7-icon{font-size:25px;line-height:1;text-align:center}
.wx7-main{font-size:14.5px;font-weight:850;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.wx7-pop{font-size:12.5px;font-weight:900;color:#2775a6;margin-left:4px;white-space:nowrap}
.wx7-temp{font-size:14.5px;font-weight:950;line-height:1.25;white-space:nowrap;text-align:right;letter-spacing:-.3px}
.wx7-temp .lo{color:#2563eb}.wx7-temp .hi{color:#dc2626}.wx7-temp .sep{color:#9aa6bb;margin:0 2px}
.home-tips-card{background:#fff;border:1px solid #ffe58a;border-radius:19px;padding:15px;margin-bottom:13px;box-shadow:var(--shadow)}
.home-tips-head{margin-bottom:7px}
.home-tips-label{font-size:16px;font-weight:950;color:#6b4d00}
.home-tips-when{display:block;font-size:13px;color:var(--ink2);font-weight:800;margin-top:3px;line-height:1.45}
.home-tip{background:#fffdf3;color:var(--ink);border:1px solid #ffe9a8;border-radius:15px;margin-top:8px;overflow:hidden}
.home-tip summary{list-style:none;cursor:pointer;display:flex;align-items:flex-start;gap:9px;padding:12px 12px}
.home-tip summary::-webkit-details-marker{display:none}
.home-tip .tic{font-size:23px;flex:none;line-height:1.2}
.home-tip .tt2{font-size:15.5px;font-weight:950;line-height:1.4;word-break:keep-all}
.home-tip .tp{font-size:13.5px;color:var(--ink2);font-weight:750;margin-top:3px;line-height:1.5;word-break:keep-all}
.home-tip .chev{margin-left:auto;color:#9aa6bb;flex:none}
.home-tip[open] .chev{transform:rotate(90deg)}
.home-tip-body{border-top:1px solid var(--line);padding:8px 13px 13px;font-size:15px;line-height:1.65}
.tip-row{display:block;padding:9px 0;border-bottom:1px dashed var(--line)}
.tip-row:last-child{border-bottom:0}
.tip-row .k{display:block;width:auto;font-size:13.5px;font-weight:950;color:var(--skyDark);margin-bottom:3px}
.tip-row .v{display:block;width:auto;font-size:15.5px;line-height:1.65;word-break:keep-all;overflow-wrap:anywhere}
.feedback-row{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}.feedback-row button{flex:1;min-width:96px;border:1.5px solid #cfe3ff;background:#f3f8ff;color:#084298;border-radius:11px;padding:9px 8px;font-size:14px;font-weight:950}.feedback-row button:active{transform:scale(.97)}.feedback-row button[data-id="done"]{background:#e9f8ee;border-color:#bdecc9;color:#146c2e}.feedback-row button[data-id="dismissed"]{background:#f2f4f8;border-color:#d5dce8;color:#5d6b82}.update-badge{display:inline-block;background:#ffe08a;color:#664d00;border-radius:999px;padding:2px 8px;font-size:12px;font-weight:950;margin-bottom:4px}
.expert-phrase{margin-top:10px;background:#172033;color:#fff;border-radius:13px;padding:11px 12px}.expert-phrase .tx{font-size:16.5px;font-weight:950;line-height:1.5}.expert-phrase .pr{font-size:15px;font-weight:850;line-height:1.55;margin-top:3px;color:#ffd43b}.expert-phrase .mn{font-size:13.5px;line-height:1.55;opacity:.88;margin-top:2px}.expert-steps{margin-top:10px;border:1px solid #dbeafe;border-radius:13px;overflow:hidden}.expert-steps .h{background:#e8f4ff;color:#075985;font-size:14px;font-weight:950;padding:8px 10px}.expert-step{display:grid;grid-template-columns:72px 1fr;gap:8px;padding:8px 10px;border-top:1px solid #e5edf7;font-size:14.5px;line-height:1.55}.expert-step:first-of-type{border-top:0}.expert-step .tm{font-weight:950;color:#075985;white-space:nowrap}.expert-near{display:inline-block;background:#dcfce7;color:#166534;border-radius:999px;padding:2px 8px;font-size:12px;font-weight:950;margin-left:5px}
.field-panel{margin-top:13px;background:#eef6ff;border:1px solid #bfdbfe;border-radius:15px;padding:11px;color:#172033}.field-title{font-size:15px;font-weight:950}.field-status{font-size:13.5px;line-height:1.55;font-weight:720;opacity:.94;margin-top:3px}.field-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.field-chips button{border:1px solid #93c5fd;background:#fff;color:#075985;border-radius:999px;padding:7px 10px;font-size:13px;font-weight:900}.field-quick{margin:10px 0 5px;background:#fff3bf;color:#172033;border:1.5px solid #ffd43b;border-radius:14px;padding:10px;display:flex;gap:10px;align-items:center;font-size:14px;line-height:1.45;font-weight:850}.field-quick.ok{background:#e7f8ee;border-color:#bdecc9}.field-quick.warn{background:#fff1f2;border-color:#fecdd3}.field-quick .grow{flex:1}.field-quick button{flex:none;border:0;border-radius:11px;background:#0b5ed7;color:#fff;padding:10px 12px;font-size:14px;font-weight:950}.field-chips button.on{background:#ffd43b;color:#172033;border-color:#ffd43b}.field-note{font-size:12px;line-height:1.5;opacity:.78;margin-top:7px}
.loc-strip{display:flex;gap:8px;align-items:center;background:#fff;border:1px solid #dbe7f6;border-radius:15px;padding:8px 10px;margin:0 0 11px;box-shadow:0 4px 14px rgba(22,34,66,.07);min-height:48px}
.loc-strip.ok{background:#effaf2;border-color:#bdecc9}.loc-strip.warn{background:#fff8d6;border-color:#ffe58a}.loc-strip.bad{background:#fff1f2;border-color:#fecdd3}.loc-strip.info{background:#eef6ff;border-color:#bfdbfe}
.loc-dot{width:10px;height:10px;border-radius:50%;background:#94a3b8;flex:none;box-shadow:0 0 0 3px rgba(148,163,184,.16)}
.loc-strip.ok .loc-dot{background:#16a34a;box-shadow:0 0 0 4px rgba(22,163,74,.15)}.loc-strip.warn .loc-dot{background:#d97706;box-shadow:0 0 0 4px rgba(217,119,6,.15)}.loc-strip.bad .loc-dot{background:#e11d48;box-shadow:0 0 0 4px rgba(225,29,72,.13)}.loc-strip.info .loc-dot{background:#0b5ed7;box-shadow:0 0 0 4px rgba(11,94,215,.13)}
.loc-main{flex:1;min-width:0}.loc-title{font-size:15px;font-weight:950;line-height:1.2;word-break:keep-all;white-space:nowrap}.loc-sub{font-size:13.5px;font-weight:720;line-height:1.55;color:#46556e;margin-top:2px;word-break:keep-all;overflow-wrap:anywhere}.loc-place{font-size:13px;font-weight:900;line-height:1.45;color:#075985;margin-top:1px;word-break:keep-all;overflow-wrap:anywhere}
.loc-actions{display:flex;gap:5px;flex:none;align-items:center}.loc-actions button{border:0;border-radius:11px;padding:9px 10px;font-size:13px;font-weight:950;background:var(--dark);color:#fff}.loc-actions button.soft{background:#fff;color:var(--skyDark);border:1px solid #cfe3ff}.loc-actions button:active,.loc-actions a:active{transform:scale(.96)}.loc-actions .loc-icon-btn{width:34px;height:34px;padding:0;border-radius:50%;font-size:18px;display:inline-flex;align-items:center;justify-content:center}.loc-actions .loc-icon-btn.soft{font-size:15px;font-weight:950;background:#fff;color:var(--skyDark);border:1px solid #cfe3ff}.loc-actions .loc-map-btn{height:34px;padding:0 9px;border-radius:10px;background:var(--dark);color:#fff;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;white-space:nowrap;font-size:12px;font-weight:950}.loc-strip{align-items:center}.loc-strip .loc-main{align-self:center}
.loc-cta{width:100%;margin-top:9px}.loc-help{margin-top:8px;font-size:13px;line-height:1.55;font-weight:720;color:#5c4700}.field-advice-item{padding:8px 0;border-top:1px solid #e7edf5}.field-advice-item:first-child{border-top:0;padding-top:0}.field-advice-source{font-size:12px;color:#53647b;margin-top:3px}.field-advice-source a{color:#075985;font-weight:800}
.evidence-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}.evidence-chip{display:inline-flex;align-items:center;border-radius:999px;padding:5px 9px;background:#eef6ff;color:#075985;font-size:12.5px;font-weight:900;line-height:1.35}.evidence-chip.good{background:#dcfce7;color:#166534}.evidence-chip.warn{background:#fef3c7;color:#92400e}.evidence-chip.neutral{background:#eef2f7;color:#526077}
.context-card{background:#f5f9ff;border:1px solid #bfdbfe;border-radius:18px;padding:14px;margin:-3px 0 13px;box-shadow:var(--shadow)}
.context-card.warn{background:#fffbea;border-color:#fde68a}.context-card .card-title{font-size:17px}.context-desc{font-size:14px;line-height:1.62;font-weight:720;color:#33415c;margin-top:5px;word-break:keep-all}
.candidate-list{display:flex;flex-direction:column;gap:8px;margin-top:11px}.candidate-btn{width:100%;text-align:left;border:1.5px solid #bfdbfe;background:#fff;border-radius:14px;padding:11px 12px;color:var(--ink)}.candidate-btn:active{transform:scale(.99)}.candidate-name{display:block;font-size:15.5px;font-weight:950;line-height:1.4}.candidate-meta{display:block;font-size:13px;font-weight:720;color:var(--ink2);line-height:1.5;margin-top:2px}
.context-details{margin-top:11px;border-top:1px dashed #cbd5e1;padding-top:10px}.context-details summary{cursor:pointer;font-size:14px;font-weight:950;color:var(--skyDark);list-style:none}.context-details summary::-webkit-details-marker{display:none}.context-details summary .chev{display:inline-block;margin-left:6px}.context-details[open] summary .chev{transform:rotate(90deg)}
.diag-pre{white-space:pre-wrap;word-break:break-word;background:#0f172a;color:#dbeafe;border-radius:13px;padding:11px;font-size:11.5px;line-height:1.55;max-height:300px;overflow:auto;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.diag-grid{display:grid;grid-template-columns:1fr;gap:0}.diag-note{font-size:12.5px;color:var(--ink2);line-height:1.55;margin-top:8px}
.now-card{border-top-width:5px}.now-context{letter-spacing:-.2px}.home-next-card{border-left:5px solid #38bdf8}.home-prep-card{border-left:5px solid #facc15}.home-emergency-card{border-left:5px solid #fb7185}
.sec-title{font-size:23px;font-weight:900;margin:4px 2px 5px;letter-spacing:-.4px}
.sec-desc{font-size:15px;color:var(--ink2);line-height:1.7;margin:0 2px 15px}
.card{background:var(--card);border:1px solid rgba(227,232,242,.9);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;margin-bottom:13px}
.card-title{font-size:18px;font-weight:900;letter-spacing:-.2px}
.row{display:flex;gap:8px}.row.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:13px;padding:12px 16px;font-size:15.5px;font-weight:800;text-decoration:none}
.btn:active{transform:scale(.97)}
.btn-pri{background:linear-gradient(135deg,#38bdf8,#0284c7);color:#fff;box-shadow:0 6px 16px rgba(2,132,199,.28)}
.btn-yellow{background:var(--yellow);color:var(--yellowInk)}
.btn-soft{background:#e8f4ff;color:var(--skyDark)}
.btn-ghost{background:#edf1f7;color:#526077}
.btn-danger{background:#fff0f0;color:var(--coral)}
.btn-dark{background:var(--dark);color:#fff}
.btn-sm{padding:10px 12px;font-size:14px;border-radius:11px}.btn-block{width:100%;padding:14px}
.icon-btn{width:35px;height:35px;border:0;border-radius:11px;background:#eef2f7;color:#5b687f;display:inline-flex;align-items:center;justify-content:center;font-size:15px;flex:none}
.empty{text-align:center;padding:30px 16px;color:var(--ink2)}
.empty .e{font-size:38px;margin-bottom:8px}.empty .t{font-weight:900;color:var(--ink);font-size:18px;margin-bottom:6px}.empty .d{font-size:15px;line-height:1.7}
.badge{display:inline-flex;align-items:center;font-size:13px;font-weight:900;padding:4px 9px;border-radius:999px;background:#e8f4ff;color:var(--skyDark)}
.badge.warn{background:#fff3d6;color:#7a4b00}.badge.good{background:#dcfce7;color:#166534}.badge.dark{background:var(--dark);color:var(--yellow)}
/* 홈 지금 카드 */
.now-card{background:#fff;border-radius:22px;box-shadow:0 10px 28px rgba(22,34,66,.13);border:1px solid #e5ebf5;border-top:7px solid var(--yellow);padding:20px 18px 17px;margin-bottom:13px}
.now-eyebrow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.now-eyebrow .lab{font-size:24px;font-weight:950;color:#8a6500;background:#fff4bf;border-radius:999px;padding:6px 14px;flex:none;letter-spacing:-.7px}
.now-fx{margin-left:auto;background:transparent;border:0;border-radius:0;padding:0;text-align:right;min-width:0;max-width:62%;overflow:hidden}
.now-fx-label{font-size:12.5px;font-weight:850;line-height:1.2;letter-spacing:-.35px;color:#667085;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now-fx-value{font-size:17.5px;font-weight:950;line-height:1.18;letter-spacing:-.65px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.now-fx-sub{font-size:10px;font-weight:650;line-height:1.25;color:#667085;white-space:normal;overflow-wrap:anywhere;margin-top:2px}
.now-first-action{margin:12px 0;padding:12px 13px;border-radius:12px;background:#fff7d1;border:1px solid #efd873;color:#30364a;line-height:1.55}

function dateOnlyUTC(iso){ const [y,m,d]=String(iso||'').split('-').map(Number); return Date.UTC(y||1970,(m||1)-1,d||1); }

function tzParts(date,tz){
  try{
    const parts=new Intl.DateTimeFormat('en-CA',{timeZone:tz,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(date);
    const o={}; parts.forEach(p=>o[p.type]=p.value); return o;
  }catch(e){
    return {year:String(date.getFullYear()),month:pad2(date.getMonth()+1),day:pad2(date.getDate()),hour:pad2(date.getHours()),minute:pad2(date.getMinutes())};

function normalizeTimeToken(t){
  t=String(t||'').trim(); if(!t) return '';

  if(m) return pad2(m[1])+':'+pad2(m[2]);

  if(k){ let h=+k[2]; if(k[1]==='오후'&&h<12)h+=12; if(k[1]==='오전'&&h===12)h=0; return pad2(h)+':'+pad2(k[3]||0); }

function parseVersion(v){ const m=String(v||'').match(/(\d+)\.(\d+)(?:\.(\d+))?/); return m?[+m[1],+m[2],+(m[3]||0)]:null; }

function normalizeState(raw){

  s.feedback=(s.feedback&&typeof s.feedback==='object'&&!Array.isArray(s.feedback))?s.feedback:{};

function wxInfo(code){
  code=Number(code);
  if(code===0)return['☀️','맑음']; if(code===1)return['🌤️','대체로 맑음']; if(code===2)return['⛅','부분 흐림']; if(code===3)return['☁️','흐림'];
  if([45,48].includes(code))return['🌫️','안개']; if([51,53,55,56,57].includes(code))return['🌦️','이슬비'];

function isRainWx(d){ return d&&([51,53,55,56,57,61,63,65,66,67,80,81,82,95,96,99].includes(Number(d.code))||Number(d.pop||0)>=50||Number(d.sum||0)>=1); }
function deriveDayWxCode(j,date,dailyCode,dailyPop,dailySum){
  const hourly=j&&j.hourly;
  if(!hourly||!Array.isArray(hourly.time)||!Array.isArray(hourly.weather_code))return dailyCode;
  const precipCodes=[51,53,55,56,57,61,63,65,66,67,71,73,75,77,80,81,82,85,86,95,96,99];
  const precipCounts={}; let precipTotal=0,fogTotal=0,cloudSum=0,cloudCount=0;
  hourly.time.forEach((t,i)=>{
    const ts=String(t||''); if(ts.slice(0,10)!==date)return;
    const hr=+ts.slice(11,13); if(hr<8||hr>20)return;
    const code=Number(hourly.weather_code[i]);
    if(precipCodes.includes(code)){ precipCounts[code]=(precipCounts[code]||0)+1; precipTotal++; }
    if(code===45||code===48)fogTotal++;
    const cc=hourly.cloud_cover?Number(hourly.cloud_cover[i]):NaN;
    if(Number.isFinite(cc)){ cloudSum+=cc; cloudCount++; }
  });
  const strongDailyRain=Number(dailyPop||0)>=50||Number(dailySum||0)>=1;
  if(precipTotal>=2||(strongDailyRain&&precipTotal>=1)){
    let best=dailyCode,bestN=-1;
    Object.keys(precipCounts).forEach(k=>{ if(precipCounts[k]>bestN){bestN=precipCounts[k];best=+k;} });
    return best;
  }
  if(fogTotal>=2)return 45;
  if(!cloudCount)return dailyCode;
  const avg=cloudSum/cloudCount;
  return avg<=20?0:(avg<=50?1:(avg<=80?2:3));
}
async function fetchFxReference(code){
  const q=encodeURIComponent(String(code||'').toUpperCase());

    const rows=await fetchJson('https://api.frankfurter.dev/v2/rates?base=USD&quotes='+q);
    const row=Array.isArray(rows)?rows.find(x=>String(x.quote||'').toUpperCase()===q):null;
    if(row&&Number.isFinite(Number(row.rate))&&String(row.date||'').match(/^\d{4}-\d{2}-\d{2}$/))return {rate:Number(row.rate),date:row.date,source:'Frankfurter v2'};
    throw new Error('Frankfurter v2 returned no valid quote');
  }catch(e){lastError=e;}
  try{
    const j=await fetchJson('https://api.frankfurter.dev/v1/latest?base=USD&symbols='+q);
    const rate=j&&j.rates?Number(j.rates[String(code).toUpperCase()]):NaN;
    if(Number.isFinite(rate)&&String(j.date||'').match(/^\d{4}-\d{2}-\d{2}$/))return {rate,date:j.date,source:'Frankfurter v1 fallback'};
    throw new Error('Frankfurter v1 returned no valid quote');
  }catch(e){throw new Error(String((e&&e.message)||lastError||e||'환율 조회 실패'));}
}

function sanitizeGuideHtml(html){
  try{
    const doc=new DOMParser().parseFromString(String(html||''),'text/html');
    doc.querySelectorAll('script,iframe,object,embed,form,base,link,meta,style').forEach(el=>el.remove());
    doc.querySelectorAll('*').forEach(el=>{
      [...el.attributes].forEach(attr=>{ const n=attr.name.toLowerCase(); if(n.startsWith('on')||n==='style')el.removeAttribute(attr.name); if((n==='href'||n==='src')&&/^\s*javascript:/i.test(attr.value))el.removeAttribute(attr.name); });

    });
    return doc.body.innerHTML;
  }catch(e){ return esc(html||''); }
}

function flightStatusText(status){

  if(x.indexOf('CANCEL')!==-1) return '❌ 취소됨';

function hotelStayGroups(){
  const groups=[];
  sortedDays().forEach(d=>{
    if(!d.hotel||!d.hotel.name||!d.date) return;
    const last=groups[groups.length-1];
    if(last&&last.name===d.hotel.name&&last.dates.length&&addDaysISO(last.dates[last.dates.length-1],1)===d.date){ last.dates.push(d.date); }
    else groups.push({name:d.hotel.name,hotel:d.hotel,city:d.city||'',dates:[d.date]});
  });
  if(groups.length) return groups.map(g=>({name:g.name,hotel:g.hotel,city:g.city,dates:g.dates,checkin:g.dates[0],checkout:addDaysISO(g.dates[g.dates.length-1],1),nights:g.dates.length}));
  return state.hotels.map(h=>({name:h.name,hotel:h,city:h.city||'',dates:[],checkin:h.checkin||'',checkout:h.checkout||'',nights:(/^\d{4}-\d{2}-\d{2}/.test(h.checkin||'')&&/^\d{4}-\d{2}-\d{2}/.test(h.checkout||''))?daysBetween(String(h.checkin).slice(0,10),String(h.checkout).slice(0,10)):''}));
}

function extractGuideTime(raw,words){
  const m=String(raw||'').match(new RegExp('(?:'+words+')[^0-9]{0,18}(\\d{1,2}:\\d{2})'));
  return m?normalizeTimeToken(m[1]):'';
}
function openGuideNoteForm(date){
  const ph=tripPhase();
  let target=String(date||'').slice(0,10);
  if(!/^\d{4}-\d{2}-\d{2}$/.test(target)){
    if(ph.phase==='during'&&ph.todayDay)target=addDaysISO(ph.todayDay.date,1);
    else if(ph.phase==='before'&&ph.start)target=ph.start;
    else target=addDaysISO(dateInTz(new Date(),HOME.tz),1);
  }
  const g=guideNoteForDate(target)||normalizeGuideNote({date:target});
  openSheet('가이드 공지 입력',
    '<div class="small-muted">가이드가 알려준 내일 기상·조식·짐·출발·집합을 넣으면 홈의 “내일 준비”와 “다음”에 바로 반영됩니다. 공지 원문을 붙여넣으면 시간도 자동으로 찾습니다.</div>'
    +fField('날짜','date',g.date,'date')
    +'<div class="f-2"><div>'+fField('기상','wake',g.wake,'time')+'</div><div>'+fField('조식','breakfast',g.breakfast,'time')+'</div></div>'
    +'<div class="f-2"><div>'+fField('짐 내놓기','luggage',g.luggage,'time')+'</div><div>'+fField('출발','depart',g.depart,'time')+'</div></div>'
    +'<div class="f-2"><div>'+fField('집합 시간','meetingTime',g.meetingTime,'time')+'</div><div>'+fField('집합 장소','meetingPlace',g.meetingPlace,'text','예: 호텔 로비')+'</div></div>'
    +fField('복장·준비물','dress',g.dress,'text','예: 어깨 가리는 옷, 여권 원본')
    +fField('현금·선택 비용','cash',g.cash,'text','예: 화장실 동전, 선택관광 €20')
    +fArea('가이드 공지 원문 붙여넣기','raw',g.note,'예) 내일 기상 06:30, 조식 07:00, 짐 07:30, 출발 08:00'),v=>{
      const raw=String(v.raw||'').trim();
      if(raw){
        if(!v.wake)v.wake=extractGuideTime(raw,'기상|모닝콜|wake');
        if(!v.breakfast)v.breakfast=extractGuideTime(raw,'조식|아침 식사|breakfast');
        if(!v.luggage)v.luggage=extractGuideTime(raw,'짐 내놓기|짐|수하물|luggage');
        if(!v.depart)v.depart=extractGuideTime(raw,'출발|버스 출발|depart');
        if(!v.meetingTime)v.meetingTime=extractGuideTime(raw,'집합|모이기|meeting');
      }
      v.note=raw;
      delete v.raw;
      const note=normalizeGuideNote(Object.assign({},v,{updatedAt:new Date().toISOString()}));
      if(!note.date){toast('날짜를 입력해 주세요.');return false;}
      if(!Array.isArray(state.guideNotes))state.guideNotes=[];
      const ix=state.guideNotes.findIndex(x=>normalizeGuideNote(x).date===note.date);
      if(ix>=0)state.guideNotes[ix]=note;else state.guideNotes.push(note);
      state.guideNotes.sort((a,b)=>(a.date||'')<(b.date||'')?-1:1);
      save(); renderAll(); toast('가이드 공지를 저장했어요');
    });
}

/* ---------- 일정 텍스트 파서/OCR ---------- */
function parseDateToken(line,baseYear){
  let m=line.match(/^(20\d{2})\s*[.\-\/년]\s*(\d{1,2})\s*[.\-\/월]\s*(\d{1,2})\s*일?\s*(.*)$/);
  if(m)return {date:m[1]+'-'+pad2(m[2])+'-'+pad2(m[3]),rest:m[4]||'',label:(+m[2])+'월 '+(+m[3])+'일'};
  m=line.match(/^(\d{1,2})\s*월\s*(\d{1,2})\s*일\s*(.*)$/)||line.match(/^(\d{1,2})\s*\/\s*(\d{1,2})\s*(.*)$/)||line.match(/^(\d{1,2})\.(\d{1,2})\.?\s*(.*)$/);
  if(m)return {date:baseYear+'-'+pad2(m[1])+'-'+pad2(m[2]),rest:m[3]||'',label:(+m[1])+'월 '+(+m[2])+'일'};
  return null;
}
function restIsHeaderOnly(rest){ return String(rest||'').replace(/[\s()\[\],·:\-~월화수목금토일요일]/g,'').length<=3; }
function extractTime(line){
  let time='',title=line;
  let m=line.match(/^(오전|오후)?\s*(\d{1,2})\s*시\s*(\d{1,2})?\s*분?\s*/);
  if(m&&(m[1]||line.indexOf('시')<8)){ let h=+m[2]; if(m[1]==='오후'&&h<12)h+=12; if(m[1]==='오전'&&h===12)h=0; time=pad2(h)+':'+pad2(m[3]||0); title=line.slice(m[0].length); }
  else { m=line.match(/\b([01]?\d|2[0-3]):([0-5]\d)\b/); if(m){ time=pad2(m[1])+':'+m[2]; let used=m[0].length; const after=line.slice(m.index+used); const r=after.match(/^\s*[~\-–]\s*([01]?\d|2[0-3]):([0-5]\d)\b/); if(r){time+='~'+pad2(r[1])+':'+r[2];used+=r[0].length;} title=(line.slice(0,m.index)+' '+line.slice(m.index+used)); } }
  return {time:normalizeTimeToken(time),title:title.replace(/^[:\-–~\s,.]+/,'').replace(/\s{2,}/g,' ').trim()||line.trim()};
}
function parseScheduleText(raw,tripStart){
  const baseYear=(tripStart?new Date(dateOnlyUTC(tripStart)).getUTCFullYear():new Date().getFullYear());
  const lines=String(raw||'').split(/\r?\n/).map(l=>l.replace(/^[\s\-*•·▶▷◦※]+/,'').replace(/^\d+[.)]\s+/,'').trim()).filter(Boolean);
  const days=[]; let cur=null;
  function ensureDay(label,date){ cur=days.find(d=>(date&&d.date===date)||d.label===label); if(!cur){cur=normalizeDay({label,date,events:[]});days.push(cur);} if(date&&!cur.date)cur.date=date; return cur; }
  lines.forEach(line=>{
    let m=line.match(/^(?:day\s*0*(\d{1,2})|(\d{1,2})\s*일차)\s*(.*)$/i);
    if(m){ const n=+(m[1]||m[2]); const rest=m[3]||''; ensureDay(n+'일차',tripStart?addDaysISO(tripStart,n-1):''); if(rest&&!restIsHeaderOnly(rest)){const e=extractTime(rest);cur.events.push({id:uid(),time:e.time,title:e.title,place:'',note:''});} return; }
    const dt=parseDateToken(line,baseYear);
    if(dt){ ensureDay(dt.label,dt.date); if(dt.rest&&!restIsHeaderOnly(dt.rest)){const e=extractTime(dt.rest);cur.events.push({id:uid(),time:e.time,title:e.title,place:'',note:''});} return; }
    if(!cur)ensureDay('날짜 미지정','');
    const e=extractTime(line); cur.events.push({id:uid(),time:e.time,title:e.title,place:'',note:''});
  });
  days.forEach(d=>d.events.sort((a,b)=>eventStartMinutes(a)-eventStartMinutes(b)));
  return days.filter(d=>d.events.length||d.date);
}
function setOcrStatus(msg,pct){ const s=$('#ocrStatus'),w=$('#ocrBarWrap'),b=$('#ocrBar'); if(s)s.textContent=msg||''; if(w)w.style.display=pct==null?'none':'block'; if(b&&pct!=null)b.style.width=Math.round(pct*100)+'%'; }
async function resizeImageFile(file){
  try{
    const bmp=await createImageBitmap(file); const scale=Math.min(1,2000/Math.max(bmp.width,bmp.height));
    if(scale>=1)return file;
    const canvas=document.createElement('canvas'); canvas.width=Math.round(bmp.width*scale); canvas.height=Math.round(bmp.height*scale);
    canvas.getContext('2d').drawImage(bmp,0,0,canvas.width,canvas.height);
    return await new Promise(resolve=>canvas.toBlob(b=>resolve(b||file),'image/jpeg',0.9));
  }catch(e){return file;}
}
async function runOcrFiles(files){
  if(!files.length)return;
  try{
    setOcrStatus('OCR 엔진을 불러오는 중… (처음에는 인터넷이 필요합니다)',0);
    await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5.0.5/dist/tesseract.min.js');
    if(typeof Tesseract==='undefined')throw new Error('OCR 엔진을 불러오지 못했습니다.');
    const worker=await Tesseract.createWorker('kor+eng',1,{logger:m=>{ if(m.status==='recognizing text')setOcrStatus('글자를 읽는 중…',m.progress); else if(m.status)setOcrStatus('준비 중… '+m.status,null); }});
    const texts=[];
    try{
      for(let i=0;i<files.length;i++){ setOcrStatus((i+1)+'/'+files.length+'장 읽는 중…',0); const prepared=await resizeImageFile(files[i]); const ret=await worker.recognize(prepared); texts.push((ret.data.text||'').trim()); }
    }finally{ await worker.terminate(); }
    const ta=$('#ocrText'); if(ta)ta.value=(ta.value.trim()?ta.value.trim()+'\n':'')+texts.filter(Boolean).join('\n');
    setOcrStatus('인식이 끝났어요. 틀린 글자를 고친 뒤 “일정으로 변환”을 눌러 주세요.',1); toast('글자 인식 완료');
  }catch(e){ setOcrStatus('인식에 실패했어요. 인터넷 연결과 사진 선명도를 확인하거나 텍스트를 직접 붙여넣어 주세요.',null); }
}

      state=emptyState(); lsSet(BUNDLED_SEED_OPT_OUT,'reset'); lsRemove(LS_OLD); lsRemove('sk_sched_html'); lsRemove('sk_sched_seed'); lsRemove('sk_trip_seed'); lsRemove('sk_pack_html'); lsRemove('sk_home_chk_html'); lsRemove('sk_upd_from');
      if(v.clearPacking){ try{const rm=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.indexOf('travel_v4_')===0)rm.push(k);}rm.forEach(k=>localStorage.removeItem(k));}catch(e){} }
      cacheStore={fx:{},weather:{}}; saveCache(); save(); applyFont(); ui.tab='home'; renderAll(); toast('초기화했어요');
    },'초기화하기');
  },
  // 일정
  'schedule-mode'(id){ const next=id==='edit'?'edit':'original'; if(ui.scheduleMode===next)return; ui.scheduleMode=next; renderMain(); pushAppHistory(); },
  'sch-toggle'(id){ ui.openDays.has(id)?ui.openDays.delete(id):ui.openDays.add(id); keepScroll(renderMain); },
  'sch-day-add'(){ openSheet('날짜 추가',fField('이름','label','','text','예: 3일차')+fField('날짜','date','','date')+fField('도시','city',''),v=>{const d=normalizeDay({label:v.label||'새 일정',date:v.date,city:v.city,events:[]});const dest=destinationFromDay(d);Object.assign(d,{tz:dest.tz||'',currency:dest.currency||'',lat:dest.lat,lon:dest.lon});state.days.push(d);state.days.sort((a,b)=>(a.date||'9999')<(b.date||'9999')?-1:1);ui.openDays.add(d.id);save();renderMain();}); },
  'sch-day-edit'(id){ const d=state.days.find(x=>x.id===id); if(!d)return; openSheet('날짜 수정',fField('이름','label',d.label)+fField('날짜','date',d.date,'date')+fField('도시','city',d.city)+fField('시간대','tz',d.tz,'text','Europe/Madrid')+fField('통화','currency',d.currency),v=>{Object.assign(d,v);state.days.sort((a,b)=>(a.date||'9999')<(b.date||'9999')?-1:1);save();keepScroll(renderMain);refreshLiveData(true);}); },
  'sch-day-del'(id){ if(confirm('이 날짜의 일정을 삭제할까요?')){state.days=state.days.filter(d=>d.id!==id);save();keepScroll(renderMain);} },
  'sch-event-add'(id){ eventForm(id,null); },
  'sch-event-edit'(id,el){ eventForm(el.dataset.extra,id); },
  'sch-event-del'(id,el){ const d=state.days.find(x=>x.id===el.dataset.extra); if(d){d.events=d.events.filter(e=>e.id!==id);save();keepScroll(renderMain);} },
  'doc-del'(id){ if(confirm('이 문서를 삭제할까요?')){state.documents=state.documents.filter(d=>d.id!==id);save();keepScroll(renderMain);} },
  'legacy-remove'(){ if(confirm('이전 버전 일정 문서를 삭제할까요?')){lsRemove('sk_sched_html');keepScroll(renderMain);} },
  'sch-photo'(){ const el=$('#camInput'); if(el)el.click(); },
  'sch-album'(){ const el=$('#imgInput'); if(el)el.click(); },
  'sch-type'(){ const el=$('#ocrText'); if(el){el.scrollIntoView({behavior:'smooth',block:'center'});setTimeout(()=>el.focus(),350);} },
  'sch-sample'(){ const el=$('#ocrText'); if(el)el.value='10월 23일 09:05 공항 도착\n15:30 호텔 체크인\n10월 24일\n9:00 박물관 출발\n14:00 공원 산책'; },
  'sch-parse'(){
    const ta=$('#ocrText'); const raw=ta?ta.value.trim():''; if(!raw){toast('먼저 일정 텍스트를 넣어 주세요.');return;}
    const parsed=parseScheduleText(raw,state.trip?state.trip.start:''); if(!parsed.length){toast('일정을 찾지 못했어요.');return;}
    if(!confirm(parsed.length+'일 일정을 추가/교체할까요? 같은 날짜는 새 내용으로 바뀝니다.'))return;
    parsed.forEach(nd=>{ const old=state.days.find(d=>(nd.date&&d.date===nd.date)||d.label===nd.label); if(old){old.events=nd.events;old.date=nd.date||old.date;ui.openDays.add(old.id);}else{state.days.push(nd);ui.openDays.add(nd.id);} });
    state.days=state.days.map(normalizeDay).sort((a,b)=>(a.date||'9999')<(b.date||'9999')?-1:1); save(); renderMain(); toast('일정으로 변환했어요');
  },
  // 항공·공항·호텔
  'airhotel-section'(id){ ui.airHotelSection=['flights','airports','hotels'].includes(id)?id:'flights'; renderMain(); },
  'flight-toggle'(id){ ui.openFlight.has(id)?ui.openFlight.delete(id):ui.openFlight.add(id); keepScroll(renderMain); },
  'secret-toggle'(id){ ui.revealed.has(id)?ui.revealed.delete(id):ui.revealed.add(id); keepScroll(renderMain); },
  'flight-copy'(id){ const r=getReservationInfo(); let val=''; if(id==='booking')val=r.bookingRef; else if(String(id).startsWith('eticket-')){ const p=(r.passengers||[])[+String(id).slice(8)]; val=p?p.eTicket:''; } if(val)copyText(val); else toast('복사할 번호가 없어요'); },
  'reservation-edit'(){ reservationForm(); },
  'flight-add'(){ flightForm(null); },
  'flight-edit'(id){ flightForm(flightList()[+id]); },
  'flight-del'(id){ const f=flightList()[+id]; if(f&&confirm('이 항공편을 삭제할까요?')){ state.trip.flights=state.trip.flights.filter(x=>x!==f); save(); keepScroll(renderMain); } },
  'tr-toggle'(id){ ui.openTransfers.has(id)?ui.openTransfers.delete(id):ui.openTransfers.add(id); keepScroll(renderMain); },
  'hotel-toggle'(id){ ui.openHotels.has(id)?ui.openHotels.delete(id):ui.openHotels.add(id); keepScroll(renderMain); },
  'air-toggle'(id){ ui.openAir.has(id)?ui.openAir.delete(id):ui.openAir.add(id); keepScroll(renderMain); },
  'air-add'(){ airportForm(null); }, 'air-edit'(id){ airportForm(state.airports.find(a=>a.id===id)); },
  'air-del'(id){ if(confirm('이 공항 정보를 삭제할까요?')){state.airports=state.airports.filter(a=>a.id!==id);save();keepScroll(renderMain);} },
  'tr-add'(){ transferForm(null); }, 'tr-edit'(id){ transferForm(state.transfers.find(t=>t.id===id)); },
  'tr-del'(id){ if(confirm('이 이동 방법을 삭제할까요?')){state.transfers=state.transfers.filter(t=>t.id!==id);save();keepScroll(renderMain);} },
  'tr-rec'(id){ const t=state.transfers.find(x=>x.id===id); if(t){t.rec=!t.rec;save();keepScroll(renderMain);} },
  'hotel-add'(){ hotelForm(null); }, 'hotel-edit'(id){ hotelForm(state.hotels.find(h=>h.id===id)); },
  'hotel-del'(id){ if(confirm('이 숙소를 삭제할까요?')){state.hotels=state.hotels.filter(h=>h.id!==id);save();keepScroll(renderMain);} },
  // 중요 정보
  'imp-add'(){ importantForm(null); }, 'imp-edit'(id){ importantForm(state.important.find(i=>i.id===id)); },
  'imp-del'(id){ if(confirm('이 중요 정보를 삭제할까요?')){state.important=state.important.filter(i=>i.id!==id);save();keepScroll(renderMain);} },
  'imp-reveal'(id){ ui.revealed.has(id)?ui.revealed.delete(id):ui.revealed.add(id); keepScroll(renderMain); },
  'imp-copy'(id){ const it=state.important.find(i=>i.id===id); if(it)copyText(it.value); },
  'check-update'(){ checkForUpdate(true); },
  'do-update'(){ doUpdate(); }
};
async function copyText(text){
  try{ await navigator.clipboard.writeText(String(text||'')); toast('복사했어요 📋'); }
  catch(e){ const ta=document.createElement('textarea'); ta.value=String(text||''); document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');toast('복사했어요 📋');}catch(_){toast('복사에 실패했어요. 길게 눌러 복사해 주세요.');} ta.remove(); }
}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-action]'); if(!el)return; const fn=actions[el.dataset.action]; if(fn)fn(el.dataset.id,el,e);
});
document.addEventListener('change',e=>{
  const id=e.target.id;
  if(id==='tripFile'){ handleTripFile(e.target.files[0]); e.target.value=''; }
  if(id==='backupFile'){ handleBackupFile(e.target.files[0]); e.target.value=''; }
  if(id==='camInput'||id==='imgInput'){ runOcrFiles(Array.from(e.target.files||[])); e.target.value=''; }
});
document.addEventListener('input',e=>{
  if(e.target.id==='fontRange'){ state.settings.fontScale=+e.target.value; applyFont(); save(); const lbl=$('#fzVal'); if(lbl)lbl.textContent=e.target.value+'%'; }
});
window.addEventListener('popstate',e=>{
  if(ui.consumePop){ ui.consumePop=false; return; }
  const wrap=$('#sheetWrap');
  if(wrap&&wrap.classList.contains('show')){ ui.sheetHistory=false; closeSheet(true); return; }
  const st=e.state; if(!st||!st.appNav)return;
  ui.navSeq=Number(st.seq||0)||0;
  applyAppNavState(st);
  if(ui.navSeq===0&&!st.guard){
    const now=Date.now();
    if(ui.rootBackAt&&now-ui.rootBackAt<2500){ ui.rootBackAt=0; try{history.back();}catch(err){} }
    else{
      ui.rootBackAt=now;
      const guard=currentAppNavState(0); guard.guard=true; try{history.pushState(guard,'');}catch(err){}
      toast('이전 화면이 없습니다. 뒤로가기를 한 번 더 누르면 앱에서 나갑니다.');
    }
  }else ui.rootBackAt=0;
});

/* ---------- 설치/업데이트 ---------- */
let deferredInstall=null, swReg=null, regWaiting=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;});
window.addEventListener('appinstalled',()=>toast('앱이 설치됐어요! 🎉'));
async function installApp(){
  if(!deferredInstall){toast("크롬 ⋮ 메뉴에서 '앱 설치'를 눌러 주세요. 이미 설치되어 있을 수도 있어요.");return;}
  const p=deferredInstall; deferredInstall=null; await p.prompt(); try{await p.userChoice;}catch(e){}
}
let versionCheckPromise=null;
async function fetchLatestVersion(){
  try{
    const res=await fetch(VERSION_FILE+'?t='+Date.now(),{cache:'no-store'});
    if(!res.ok)throw new Error('version '+res.status);
    const data=await res.json();
    const latest=String((data&&(data.version||data.appVersion))||'').trim();
    if(latest){ ui.latestVersion=latest; ui.latestNotes=String((data&&(data.notes||data.note))||'').trim(); }
    return latest;
  }catch(e){ return ''; }
}
function announceUpdate(){
  if(!updateAvailable())return;
  if(ui.tab==='home'||ui.tab==='settings')keepScroll(renderMain);
  if(!ui.updToasted){
    ui.updToasted=true;
    const v=updateVersionText();
    setTimeout(()=>toast(v?('🆕 새 버전 '+v+'가 나왔습니다. 설정 맨 아래에서 업데이트할 수 있어요.'):'🆕 새 버전을 업데이트할 수 있습니다. 설정 맨 아래에서 확인해 주세요.'),700);
  }
}
async function checkForUpdate(manual){
  const now=Date.now();
  if(!manual&&ui.lastVersionCheck&&now-ui.lastVersionCheck<60000)return updateAvailable();
  if(versionCheckPromise)return versionCheckPromise;
  ui.lastVersionCheck=now;
  if(manual)toast('새 버전인지 확인하는 중…');
  versionCheckPromise=(async()=>{
    const fetched=await fetchLatestVersion();
    let swChecked=false;
    if(swReg){
      try{
        await swReg.update(); swChecked=true;
        if(swReg.waiting&&navigator.serviceWorker.controller){ regWaiting=swReg.waiting; ui.updateReady=true; }
      }catch(e){}
    }
    if(updateAvailable()){
      if(manual){
        ui.updToasted=true;
        if(ui.tab==='home'||ui.tab==='settings')keepScroll(renderMain);
        if(ui.tab==='settings')setTimeout(()=>{const f=$('.version-footer');if(f)f.scrollIntoView({behavior:'smooth',block:'end'});},60);
        const v=updateVersionText();
        toast(v?('🆕 새 버전 '+v+'로 업데이트할 수 있습니다.'):'🆕 새 버전을 업데이트할 수 있습니다.');
      }else announceUpdate();
      return true;
    }
    if(manual)toast((fetched||swChecked)?('지금 버전 '+APP_VERSION+'이 최신이에요 ✓'):'인터넷 연결을 확인해 주세요.');
    return false;
  })();
  try{ return await versionCheckPromise; }finally{ versionCheckPromise=null; }
}
function waitForWaitingWorker(timeoutMs){
  return new Promise(resolve=>{
    if(!swReg){resolve(null);return;}
    if(swReg.waiting){resolve(swReg.waiting);return;}
    const inst=swReg.installing; if(!inst){resolve(null);return;}
    const timer=setTimeout(()=>resolve(swReg.waiting||null),timeoutMs||4500);
    inst.addEventListener('statechange',()=>{
      if(inst.state==='installed'){clearTimeout(timer);resolve(swReg.waiting||inst);}
      if(inst.state==='redundant'){clearTimeout(timer);resolve(swReg.waiting||null);}
    });
  });
}
async function doUpdate(){
  ui.updating=true; lsSet('sk_upd_from',APP_VERSION);
  if(regWaiting){ toast('업데이트 중…'); try{regWaiting.postMessage('SKIP_WAITING');}catch(e){location.reload();} return; }
  toast('업데이트를 준비하는 중…');
  await fetchLatestVersion();
  if(swReg){
    try{ await swReg.update(); }catch(e){}
    const waiting=await waitForWaitingWorker(4500);
    if(waiting){ regWaiting=waiting; ui.updateReady=true; toast('업데이트 중…'); try{waiting.postMessage('SKIP_WAITING');}catch(e){location.reload();} return; }
  }
  if(updateAvailable()){ location.reload(); return; }
  ui.updating=false; lsRemove('sk_upd_from');
  toast('지금 버전 '+APP_VERSION+'이 최신이에요 ✓');
}
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(reg=>{
      swReg=reg;
      const show=()=>{ if(reg.waiting)regWaiting=reg.waiting; if(regWaiting)ui.updateReady=true; fetchLatestVersion().finally(()=>announceUpdate()); };
      if(reg.waiting&&navigator.serviceWorker.controller)show();
      reg.addEventListener('updatefound',()=>{const nw=reg.installing;if(!nw)return;nw.addEventListener('statechange',()=>{if(nw.state==='installed'&&navigator.serviceWorker.controller)show();});});
      try{reg.update();}catch(e){}
      setTimeout(()=>checkForUpdate(false),1200);
    }).catch(()=>{});
    let reloading=false;
    navigator.serviceWorker.addEventListener('controllerchange',()=>{ if(reloading||!(ui.updateReady||ui.updating))return; reloading=true; if(!lsGet('sk_upd_from'))lsSet('sk_upd_from',APP_VERSION); location.reload(); });
  });
}
document.addEventListener('visibilitychange',()=>{
  locDiag(document.hidden?'app_hidden':'app_visible',{tab:ui.tab,hasFix:!!ui.geo,fixAgeSec:ui.geo?geoQuality(ui.geo).ageSec:null});
  if(document.hidden){clearGeoRetry();return;}
  checkForUpdate(false); maybeAutoStartFieldLocation(); ensureFieldLocationFresh(); refreshFieldContext(false);
});
window.addEventListener('online',()=>{ locDiag('network_online',{tab:ui.tab}); if(ui.tab==='home'||ui.tab==='settings')keepScroll(renderMain); });
window.addEventListener('offline',()=>{ locDiag('network_offline',{tab:ui.tab,hasFix:!!ui.geo}); if(ui.tab==='home'||ui.tab==='settings')keepScroll(renderMain); });
window.addEventListener('pageshow',()=>{ if(!document.hidden){locDiag('app_pageshow',{tab:ui.tab,hasFix:!!ui.geo}); maybeAutoStartFieldLocation(); ensureFieldLocationFresh();} });

/* ---------- 시작 ---------- */
locDiag('app_start',{version:APP_VERSION,secure:typeof window==='undefined'?null:!!window.isSecureContext,online:!!navigator.onLine,fieldEnabled:!!(state.settings&&state.settings.fieldModeEnabled),optOut:!!(state.settings&&state.settings.fieldModeOptOut),tab:ui.tab});
applyFont(); save(); renderAll(); loadChecklist(); refreshLiveData(false); refreshInfoUpdates(false); ensureBundledSpainTrip(); maybeAutoStartFieldLocation();
setTimeout(()=>maybeRequestInitialFieldPermission(),900);
initAppHistory();
setInterval(()=>{
  if(document.hidden||$('#sheetWrap').classList.contains('show'))return;
  if(ui.tab==='home'){updateHomeTopBoard(false); refreshLiveData(false); refreshInfoUpdates(false); ensureFieldLocationFresh(); refreshFieldContext(false);}
  else if(ui.tab==='settings'){ensureFieldLocationFresh(); refreshFieldContext(false);}
},30000);
setTimeout(()=>checkForUpdate(false),1800);
try{ const from=lsGet('sk_upd_from'); if(from){lsRemove('sk_upd_from'); if(from!==APP_VERSION)setTimeout(()=>toast('✅ 업데이트 완료! 지금 버전은 '+APP_VERSION+'입니다.'),900);} }catch(e){}
</script>
