<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1d4ed8">
<meta name="description" content="여행 일정, 준비물, 중요 정보를 한 곳에서">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<title>SK-여행</title>
<style>
:root{
  --pri:#1d4ed8; --acc:#2563eb; --ink:#0f172a; --ink2:#475569; --ink3:#94a3b8;
  --line:#e2e8f0; --soft:#f5f8ff; --soft2:#eff6ff;
  --web:#fef9c3; --webb:#eab308; --chk:#fce7f3; --chkb:#db2777;
  --red:#dc2626;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:system-ui,-apple-system,"Noto Sans KR","Malgun Gothic",sans-serif;
  font-size:calc(15px * var(--fz,1));color:var(--ink);background:#fff;
  -webkit-tap-highlight-color:transparent;
}
button,input,select,textarea{font:inherit;color:inherit}
.hdr{
  position:sticky;top:0;z-index:20;background:var(--pri);color:#fff;
  padding:calc(12px + env(safe-area-inset-top)) 16px 12px;
}
.hdr .t{font-size:17px;font-weight:800;letter-spacing:-.2px}
.hdr .s{font-size:12.5px;opacity:.9;margin-top:2px}
main{padding:14px 14px calc(92px + env(safe-area-inset-bottom))}
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom);
}
nav button{
  border:0;background:none;padding:8px 0 9px;display:flex;flex-direction:column;align-items:center;gap:2px;
  font-size:11.5px;color:var(--ink3);cursor:pointer;
}
nav button .e{font-size:19px;line-height:1}
nav button.on{color:var(--acc);font-weight:800}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{margin:0 0 10px;font-size:15px;font-weight:800;color:var(--pri)}
.muted{color:var(--ink2);font-size:12.5px;line-height:1.55}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.btn{
  border:0;border-radius:10px;padding:10px 14px;font-weight:700;background:var(--acc);color:#fff;cursor:pointer;
  font-size:14px;
}
.btn.ghost{background:#fff;color:var(--acc);border:1px solid #bfdbfe}
.btn.danger{background:var(--red)}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:8px}
.btn.block{width:100%}
.btn:disabled{opacity:.5}
.iconbtn{border:0;background:none;padding:4px 6px;cursor:pointer;font-size:14px;color:var(--ink2)}
input[type=text],input[type=date],input[type=search],textarea,select{
  width:100%;padding:10px 11px;border:1px solid #cbd5e1;border-radius:10px;background:#fff;font-size:15px;
}
textarea{min-height:120px;resize:vertical}
label.ck{display:flex;gap:10px;align-items:flex-start;padding:7px 0;cursor:pointer;line-height:1.45}
label.ck input{margin-top:3px;width:18px;height:18px;accent-color:var(--acc);flex:0 0 auto}
.bar{height:8px;background:#e2e8f0;border-radius:99px;overflow:hidden;margin:8px 0 2px}
.bar>i{display:block;height:100%;background:var(--acc)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.clk{font-size:24px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.clk-d{font-size:12px;color:var(--ink2);margin-top:2px}
.pill{display:inline-block;font-size:11px;font-weight:700;border-radius:99px;padding:2px 8px;margin-left:6px;vertical-align:1px}
.pill.web{background:var(--web);color:#854d0e}
.pill.chk{background:var(--chk);color:#9d174d}
.pill.today{background:#dbeafe;color:var(--pri)}
.legend{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 12px}
.lg{font-size:12px;padding:4px 9px;border-radius:8px;border:1px solid var(--line);color:var(--ink2);background:#fff}
.lg.web{background:var(--web);border-color:#fde68a}
.lg.chk{background:var(--chk);border-color:#fbcfe8}
.dayhead{display:flex;gap:10px;align-items:center;cursor:pointer;user-select:none}
.chip{
  flex:0 0 auto;background:var(--acc);color:#fff;border-radius:8px;padding:5px 8px;min-width:70px;text-align:center;
  font-weight:800;font-size:13px;font-variant-numeric:tabular-nums;
}
.dtitle{font-weight:800;color:var(--pri);font-size:16px;line-height:1.3}
.dsum{font-size:12.5px;color:var(--ink2);margin-top:2px}
.chev{margin-left:auto;color:var(--ink3);transition:transform .15s}
.day.open .chev{transform:rotate(180deg)}
.daybody{display:none;padding-top:10px}
.day.open .daybody{display:block}
.flt{background:var(--soft2);border-radius:10px;padding:8px 10px;font-size:13px;margin:8px 0;color:var(--pri)}
.it{display:grid;grid-template-columns:52px 1fr;gap:8px;padding:8px 6px;border-bottom:1px dashed var(--line);border-radius:0}
.it:last-child{border-bottom:0}
.it .tm{color:var(--acc);font-weight:800;font-size:13.5px;font-variant-numeric:tabular-nums;padding-top:1px}
.it .tt{line-height:1.5;word-break:keep-all}
.it .dt{font-size:12.5px;color:var(--ink2);white-space:pre-line;margin-top:2px;line-height:1.5}
.it.web{background:var(--web);border-radius:10px;border-bottom:0;margin-bottom:4px}
.it.chk{background:var(--chk);border-radius:10px;border-bottom:0;margin-bottom:4px}
.meals{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.meal{font-size:12px;border:1px solid var(--line);border-radius:99px;padding:3px 10px;color:var(--ink2)}
.meal b{color:var(--acc);margin-right:3px}
.hotel{border-left:4px solid var(--acc);background:var(--soft2);border-radius:10px;padding:9px 11px;margin-top:10px;font-size:13px;line-height:1.5}
.hotel .n{font-weight:800;color:var(--ink)}
.hotel a{color:var(--acc);font-weight:700;text-decoration:none}
.note{border-radius:10px;padding:8px 10px;font-size:12.5px;line-height:1.5;margin-top:8px;white-space:pre-line}
.note.web{background:var(--web)}
.note.chk{background:var(--chk)}
.note.paper{background:#f8fafc}
.wx{display:grid;grid-template-columns:70px 36px 1fr auto;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.wx:last-child{border-bottom:0}
.wx .e{font-size:20px;text-align:center}
.wx .tp{font-variant-numeric:tabular-nums;color:var(--ink2);font-size:13px;text-align:right}
.wx .d{font-weight:700}
.acc-h{display:flex;gap:8px;align-items:center;padding:10px 0;cursor:pointer;font-weight:700;border-bottom:1px solid var(--line)}
.acc-h:last-child{border-bottom:0}
.acc-b{display:none;padding:2px 0 10px;font-size:13.5px;line-height:1.6;white-space:pre-line;color:var(--ink2)}
.acc.open .acc-b{display:block}
.acc.open .chev{transform:rotate(180deg)}
.res{border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:9px}
.res .l{font-size:12.5px;color:var(--ink2);font-weight:700}
.res .v{font-size:16px;font-weight:700;margin-top:3px;word-break:break-all;font-variant-numeric:tabular-nums}
.res .acts{display:flex;gap:6px;margin-top:8px}
.empty{text-align:center;padding:26px 14px}
.empty .big{font-size:40px}
.empty h3{margin:8px 0 4px;color:var(--pri);font-size:17px}
.sec-t{font-weight:800;color:var(--pri);margin:16px 2px 8px;font-size:15px}
.ov{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:520px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 8px;font-size:17px;color:var(--pri)}
.sheet .btns{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.opt{border:1px solid var(--line);border-radius:12px;padding:12px;text-align:left;background:#fff;cursor:pointer;width:100%}
.opt b{display:block;font-size:15px}
.opt span{display:block;font-size:12.5px;color:var(--ink2);margin-top:3px;line-height:1.45}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom));background:#0f172a;color:#fff;padding:10px 14px;border-radius:12px;font-size:13.5px;z-index:80;max-width:90%;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.warn{background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;padding:9px 11px;font-size:12.5px;line-height:1.5;color:#9a3412;margin:8px 0}
.err{background:#fef2f2;border:1px solid #fecaca;border-radius:10px;padding:9px 11px;font-size:13px;line-height:1.5;color:#991b1b;margin:8px 0}
iframe.htmlv{width:100%;height:70vh;border:1px solid var(--line);border-radius:12px;background:#fff}
</style>
</head>
<body>
<header class="hdr" id="hdr"></header>
<main id="view"></main>
<nav id="nav"></nav>
<div id="modal"></div>
<div id="toast"></div>
<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
